<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>단어장</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#5980a6" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.js"></script>
<style>
:root {
  /* card-scoped font (font-size control only affects word-card text) */
  --card-font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  --card-font-size: 15px;
  /* recomputed in render() from --card-font-size — see the headword note there */
  --card-headword-size: 26px;
  /* numbers/labels — mixed into Korean text, falls back per-character for
     the glyphs it doesn't cover (Barlow Condensed is Latin/digits only) */
  --font-heading: 'Barlow Condensed', 'IBM Plex Sans KR', sans-serif;

  --paper: #f2f2f3;
  --ink: #1d1f20;
  --steel: #5980a6;
  --steel-txt: #3f6485;
  /* Steel used as a *filled surface carrying text*. Plain --steel only
     reaches 4.15:1 against white, so the fill goes a step darker in light
     mode; in dark mode the fill stays light and the text flips to paper —
     the same inversion the rest of the palette uses. */
  --steel-solid: #3f6485;
  --on-steel-solid: #ffffff;
  --steel-fill: color-mix(in srgb, var(--steel) 8%, var(--paper));
  --steel-soft: color-mix(in srgb, var(--steel) 12%, var(--paper));
  --important-underline: color-mix(in srgb, var(--steel) 45%, var(--paper));
  --rule: color-mix(in srgb, var(--ink) 22%, transparent);
  --rule-soft: color-mix(in srgb, var(--ink) 12%, transparent);
  --rule-strong: color-mix(in srgb, var(--ink) 35%, transparent);
  --muted: #5b5e62;
  --muted-2: #838689;
  --fill: color-mix(in srgb, var(--ink) 12%, transparent);
  --danger: #e5484d;
  --danger-soft: #fde8e8;
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.3);
}

body.dark {
  --paper: #17181a;
  --ink: #f0f1f2;
  --steel: #7ea6c9;
  --steel-txt: #7ea6c9;
  --steel-solid: #7ea6c9;
  --on-steel-solid: #17181a;
  --steel-fill: color-mix(in srgb, var(--steel) 12%, var(--paper));
  --steel-soft: color-mix(in srgb, var(--steel) 16%, var(--paper));
  --important-underline: color-mix(in srgb, var(--steel) 55%, var(--paper));
  --rule: color-mix(in srgb, var(--ink) 24%, transparent);
  --rule-soft: color-mix(in srgb, var(--ink) 13%, transparent);
  --rule-strong: color-mix(in srgb, var(--ink) 38%, transparent);
  --muted: #9aa0a6;
  --muted-2: #7d8288;
  --fill: color-mix(in srgb, var(--ink) 15%, transparent);
  --danger: #ff6b6b;
  --danger-soft: #4a2323;
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--paper);
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  font-size: 15px;
  transition: background 0.15s ease, color 0.15s ease;
}

button,
select,
input {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--steel);
  outline-offset: 2px;
}

/* Every icon is a Lucide SVG swapped in for a <i data-lucide="..."> placeholder
   at render time (see icon() / lucide.createIcons() in app.js) — one
   consistent icon language, no emoji or ad-hoc inline SVGs. */
svg.lucide {
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}

/* Full viewport width on PC — no centered max-width column. */
#app {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 30px 34px 44px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- toolbar ---------- */

/* The system bar is a rule under the row, not a boxed panel — that single
   bottom line is what separates it from the page below it. */
.toolbar {
  position: relative;
  background: var(--paper);
  border: none;
  border-bottom: 1px solid var(--rule);
  border-radius: 0;
  padding: 0 0 11px;
}

.toolbar-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  row-gap: 10px;
  white-space: nowrap;
}

.toolbar-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px;
  padding: 0 14px;
  border-left: 1px solid var(--rule-soft);
}

.toolbar-brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding-right: 18px;
}

.brand-name {
  font-size: 19px;
  font-weight: 600;
}

.brand-count {
  font-family: var(--font-heading);
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.toolbar-group-right {
  margin-left: auto;
}

.mode-segment {
  display: inline-flex;
  border: 1px solid var(--rule);
}

.mode-segment-btn {
  border: none;
  background: var(--paper);
  color: var(--muted);
  padding: 4px 11px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
}

.mode-segment-btn + .mode-segment-btn {
  border-left: 1px solid var(--rule);
}

.mode-segment-btn.active {
  background: var(--ink);
  color: var(--paper);
}

/* Always-visible options row under the system bar on PC (no toggle). Hidden
   on mobile, where the same controls live in the settings sheet. */
body.is-mobile .view-options-row {
  display: none;
}

.view-options-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 24px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-soft);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  border-radius: 0;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

/* System-bar buttons go borderless — icon + label already carry the
   affordance there, and the boxes were pure noise across a full-width bar.
   Scoped to .toolbar so the session's outlined "다시 보기" and the modal
   chip groups, where the border IS the affordance, keep theirs. */
.toolbar .btn,
.toolbar .chip-btn {
  border-color: transparent;
  background: transparent;
}

.toolbar .btn:hover,
.toolbar .chip-btn:hover {
  border-color: transparent;
  color: var(--steel-txt);
}

/* filled states (active toggle, 오늘 복습) keep their fill */
.toolbar .chip-btn.active,
.toolbar .chip-btn.due-active {
  border-color: transparent;
}

.btn-primary {
  background: var(--steel-solid);
  border-color: var(--steel-solid);
  color: var(--on-steel-solid);
}

.btn-primary:hover {
  opacity: 0.9;
  color: #fff;
}

.opt {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9em;
  color: var(--muted);
  white-space: nowrap;
}

.opt select {
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 3px 6px;
  background: var(--paper);
  color: var(--ink);
}

/* Borderless, tightly grouped around the value — gap:0 plus a narrow value
   column pulls − and + in close instead of leaving them floating. */
.stepper {
  display: inline-flex;
  align-items: center;
  gap: 0;
}

.stepper button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border-radius: 0;
  border: none;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  line-height: 1;
}

.stepper button:hover {
  color: var(--steel-txt);
}

.stepper-value {
  min-width: 1.1em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-heading);
}

/* icon-only toggle (dark mode) — square hit target, centered icon */
.icon-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 10px;
}

/* ---------- layout ---------- */

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--progress-w, 260px);
  gap: 16px;
  align-items: start;
  max-width: 100%;
}

/* Also a column of the page rather than a boxed panel — same reasoning as
   .toolbar / .progress-panel; the card grid draws its own rules. */
.feed-panel {
  min-width: 0;
  background: var(--paper);
  border: none;
  border-radius: 0;
  padding: 0;
}

.feed-header-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  row-gap: 8px;
  gap: 12px;
  margin-bottom: 12px;
}

.feed-header {
  font-weight: 600;
  font-size: 21px;
}

.current-category-label {
  font-size: 0.85em;
  color: var(--muted);
  font-weight: 600;
}

/* ---------- search bar (rendered once for PC, once for mobile — see
   renderSearchBar; only one copy is visible per breakpoint) ---------- */

.search-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.feed-header-row .search-bar {
  margin-left: auto;
}

.search-scope {
  flex: 0 0 auto;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 4px 6px;
  background: var(--paper);
  color: var(--ink);
  font-size: 0.85em;
}

.search-input {
  /* no shrink — the spec width is exact, and .feed-header-row wraps instead
     of squeezing it when the row runs out of room */
  flex: 0 0 210px;
  min-width: 80px;
  border: none;
  border-bottom: 1px solid var(--rule-strong);
  border-radius: 0;
  padding: 5px 4px;
  background: transparent;
  color: var(--ink);
  font-size: 0.9em;
}

.search-advanced-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 4px 9px;
  cursor: pointer;
}

.search-advanced-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.search-advanced-btn.active {
  border-color: var(--steel);
  color: var(--steel-txt);
  background: var(--steel-soft);
}

.position-indicator {
  font-size: 13px;
  font-family: var(--font-heading);
  color: var(--muted);
}

/* ---------- feed / cards ---------- */

/* Footer: keyboard hints on the left, pagination centered — the hints sit
   in the left 1fr track so the pagination stays optically centered in the
   panel rather than being pushed off-center by them. */
.feed-footer {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.feed-key-hints {
  grid-column: 1;
  justify-self: start;
  font-size: 0.8em;
  color: var(--muted);
  white-space: nowrap;
}

.feed-nav-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.jump-box {
  grid-column: 1;
  justify-self: start;
  flex: 0 0 auto;
}

.jump-input {
  width: 70px;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 5px 8px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-heading);
}

.pagination-bar {
  grid-column: 2;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.page-nav-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 4px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  border-radius: 0;
  cursor: pointer;
}

.page-nav-btn:hover:not(:disabled) {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.page-nav-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.page-num-list {
  display: flex;
  align-items: center;
  gap: 2px;
}

.page-num-btn {
  flex: 0 0 auto;
  min-width: 26px;
  height: 26px;
  padding: 0 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  cursor: pointer;
  font-size: 0.82em;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-heading);
}

.page-num-btn:hover {
  background: var(--fill);
  color: var(--ink);
}

/* README: "페이지네이션(현재 페이지 = 잉크 채움)" — ink, not steel. Also the
   highest-contrast pairing available, which is what this small 12px label
   needs. */
.page-num-btn.current {
  background: var(--ink);
  color: var(--paper);
  font-weight: 700;
}

.cards {
  min-width: 0;
  display: grid;
  gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule-soft);
  align-content: start;
  /* Without this, a touch drag here is ambiguous to the browser (the page
     also scrolls vertically) and it can claim the gesture as a native
     scroll mid-swipe, cancelling the pointer sequence before our swipe
     handler's pointerup ever fires. pan-y keeps vertical scrolling native
     while forcing horizontal movement to stay under JS control. */
  touch-action: pan-y;
}

.cards-empty {
  color: var(--muted);
  padding: 40px 0;
  text-align: center;
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.cards-empty p {
  margin: 0;
}

/* ---------- word card (a "단" of the dictionary page, not a boxed card:
   no rounding, no shadow, no fill of its own — state is fill/weight, and
   its only edges are the shared rule lines from .cards above) ---------- */

.word-card {
  min-width: 0;
  font-family: var(--card-font-family);
  font-size: var(--card-font-size);
  font-weight: 400;
  border-right: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  border-radius: 0;
  padding: 18px 20px 22px 18px;
  min-height: 250px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  background: transparent;
  touch-action: pan-y;
}

.word-card.memorized {
  background: var(--steel-fill);
}


.word-card.focused {
  position: relative;
  z-index: 2;
  box-shadow: inset 0 0 0 1px var(--steel);
}

/* ---------- edit mode: table (분류 | 표제어 | 뜻) instead of the card grid ---------- */

.edit-table {
  display: flex;
  flex-direction: column;
}

.edit-table-header {
  display: grid;
  grid-template-columns: 120px 190px minmax(0, 1fr);
  gap: 14px;
  padding: 0 0 8px;
  border-bottom: 1px solid var(--rule);
  color: var(--muted);
  font-size: 0.82em;
  font-weight: 600;
}

.edit-row {
  display: grid;
  grid-template-columns: 120px 190px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-soft);
}

.edit-row.edit-selected {
  box-shadow: inset 0 0 0 2px var(--danger);
  background: var(--danger-soft);
}

.edit-field {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 8px 10px;
  background: var(--paper);
  color: var(--ink);
  font-family: inherit;
  font-size: inherit;
  /* height is driven entirely by JS (see autoResizeEditFields / the
     'input' listener) to track content the way the normal card's static
     text just wraps and grows — overflow:hidden keeps no stray scrollbar
     flashing in the moment before each resize catches up, and resize:none
     avoids a manual drag-handle fighting the auto-grow on the next
     keystroke. */
  overflow: hidden;
  resize: none;
}

/* 분류/표제어: no border until focused, just an underline — README's
   "포커스 시 밑줄만 스틸로" */
.edit-inline-field {
  border: none;
  border-bottom: 1px solid transparent;
  border-radius: 0;
  padding: 4px 2px;
  background: transparent;
}

.edit-inline-field:focus {
  outline: none;
  border-bottom-color: var(--steel);
}

.edit-word-input {
  font-size: 1.15em;
  font-weight: 700;
}

.edit-row-word {
  display: flex;
  align-items: center;
  gap: 6px;
}

.edit-word-delete-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.edit-word-delete-btn:hover {
  color: var(--danger);
}

.edit-row-meanings {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.edit-meaning-row {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  border-top: 2px solid transparent;
  border-bottom: 2px solid transparent;
}

.edit-meaning-row.dragging {
  opacity: 0.4;
}

.edit-meaning-row.drop-before {
  border-top-color: var(--steel);
}

.edit-meaning-row.drop-after {
  border-bottom-color: var(--steel);
}

.edit-meaning-grip {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  padding-top: 6px;
  color: var(--muted);
  cursor: grab;
}

.edit-meaning-grip:active {
  cursor: grabbing;
}

/* Keyboard/single-pointer alternative to the drag grip (WCAG 2.2 AA). */
.edit-meaning-move {
  flex: 0 0 auto;
  display: inline-flex;
  flex-direction: column;
  padding-top: 2px;
}

.edit-meaning-move-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 16px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.edit-meaning-move-btn:hover:not(:disabled) {
  color: var(--steel-txt);
}

.edit-meaning-move-btn:disabled {
  opacity: 0.3;
  cursor: default;
}

.edit-meaning-index {
  flex: 0 0 auto;
  padding-top: 8px;
  font-family: var(--font-heading);
  color: var(--muted);
}

.edit-meaning-fields {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.edit-example-input {
  font-size: 0.9em;
  color: var(--muted);
}

.edit-meaning-delete {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  padding-top: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}

.edit-meaning-delete:hover {
  color: var(--danger);
}

.edit-add-meaning-btn {
  flex: 0 0 auto;
  align-self: flex-start;
  margin-top: 4px;
  border: 1px dashed var(--rule);
  border-radius: 0;
  padding: 6px 14px;
  background: transparent;
  color: var(--muted);
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
}

.edit-add-meaning-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.edit-add-word-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 0;
  background: var(--steel-solid);
  color: var(--on-steel-solid);
  font-weight: 600;
  cursor: pointer;
}

.edit-add-word-btn:hover {
  opacity: 0.9;
}

.edit-trash-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 2px solid var(--danger);
  border-radius: 0;
  background: var(--paper);
  color: var(--danger);
  opacity: 0.5;
  cursor: pointer;
}

.edit-trash-btn.has-selection {
  opacity: 1;
}

.edit-trash-btn:hover {
  background: var(--danger-soft);
}

/* Side tracks share one min width so they stay symmetric and the headword
   reads as centered; the middle track is minmax(0,1fr) so it can actually
   shrink — that's what lets a long headword wrap instead of pushing the
   bookmark/search icons out past the card edge. */
.card-word {
  --card-word-side: 54px;
  display: grid;
  grid-template-columns:
    minmax(var(--card-word-side), auto)
    minmax(0, 1fr)
    minmax(var(--card-word-side), auto);
  align-items: center;
  column-gap: 6px;
  font-size: var(--card-headword-size);
  font-weight: 600;
  letter-spacing: -0.02em;
  padding: 0 0 12px;
  margin-bottom: 10px;
}

.card-word.important .card-word-text {
  box-shadow: inset 0 -12px 0 var(--important-underline);
}

/* Leading square = the memorize toggle (see renderCard). PC shows it only
   once memorized, matching the documented "표제어 앞 9px 스틸 사각"; mobile
   always shows it and gives it a real touch target. */
/* Hit area is padded out to the WCAG 2.2 AA 24px minimum while the square
   itself stays 9px — negative margin keeps the extra padding from shifting
   the headword's optical alignment. */
.card-memo-toggle {
  grid-column: 1;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  min-height: 24px;
  margin: -8px 0 -8px -7px;
  border: none;
  background: transparent;
  padding: 0;
  cursor: pointer;
}

.card-memo-square {
  width: 9px;
  height: 9px;
  background: transparent;
}

.card-memo-toggle.active .card-memo-square {
  background: var(--steel);
}

/* Long headwords (proverbs) wrap inside the card. keep-all keeps Korean
   breaking at word boundaries rather than mid-word; overflow-wrap is the
   last-resort escape for a single token wider than the column. No nowrap —
   that was what pushed long headwords past the card edge. */
.card-word-text {
  grid-column: 2;
  min-width: 0;
  text-align: center;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.card-word.placeholder {
  display: block;
  text-align: center;
  color: var(--muted);
  font-weight: 500;
  font-size: 1em;
}

.card-word-icons {
  grid-column: 3;
  justify-self: end;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.card-bookmark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  min-height: 24px;
  border: none;
  background: transparent;
  padding: 4px;
  margin: 0;
  color: var(--muted);
  opacity: 0.25;
  cursor: pointer;
}

.card-bookmark:hover {
  opacity: 0.7;
}

.card-bookmark.active {
  opacity: 1;
  color: var(--ink);
}

.card-bookmark.active:hover {
  opacity: 0.85;
}

.dict-link {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  min-height: 24px;
  color: var(--muted);
  opacity: 0.5;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.dict-link:hover {
  opacity: 1;
  color: var(--steel-txt);
}

.card-meanings {
  flex: 1;
  overflow-y: auto;
  /* Without this, setting only overflow-y here makes the browser silently
     treat overflow-x as "auto" too (that's spec behavior, not a bug on its
     own) — so anything even 1px wider than the card, like the meaning-item
     negative-margin trick below, was popping a horizontal scrollbar. */
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
  touch-action: pan-y;
}

.card-footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
}

.card-category {
  font-family: var(--font-heading);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.card-stage-dots {
  flex: 0 0 auto;
  display: inline-flex;
  gap: 3px;
}

.card-stage-dot {
  width: 7px;
  height: 7px;
  background: var(--fill);
}

.card-stage-dot.filled {
  background: var(--steel);
}

.meanings-placeholder,
.meaning-empty {
  color: var(--muted);
  text-align: center;
  padding: 24px 8px;
  font-size: 0.9em;
}

.meaning-item {
  display: flex;
  gap: 4px;
  align-items: flex-start;
  /* Widens the clickable/hover area without bleeding past the card's own
     edge — an earlier version used a negative margin to push past it for
     a bit more room, but that's exactly what was overflowing the card
     horizontally. */
  padding: 4px 6px;
  cursor: pointer;
  /* the whole row toggles checked now (not just the small number button),
     so it shouldn't also read as selectable text — that just fights the
     click with the browser's native text-selection */
  user-select: none;
}

/* Hover-capable pointers only. On touch, :hover latches after a tap and the
   orange stayed painted on the row long after the finger left — that stuck
   highlight was the "long-press box that won't go away". */
@media (hover: hover) and (pointer: fine) {
  .meaning-item:hover {
    background: color-mix(in srgb, #cf8a13 16%, transparent);
  }
}

.check-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  color: var(--muted);
  font-family: var(--font-heading);
  font-size: 14px;
  font-weight: 600;
  line-height: inherit;
  white-space: nowrap;
  cursor: pointer;
}

.check-btn:hover {
  color: var(--steel-txt);
}

.check-btn.checked {
  color: var(--steel-txt);
}

.meaning-text {
  flex: 1;
  min-width: 0;
}

.meaning {
  font-weight: 400;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.example {
  font-size: 13.5px;
  color: var(--muted);
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.meaning-item.checked .meaning,
.meaning-item.checked .example {
  color: var(--muted);
  text-decoration: line-through;
  font-weight: 400;
}

/* ---------- progress panel ---------- */

/* A column of the page separated by one rule, not a boxed panel — same
   "지면" logic as the system bar above. */
.progress-panel {
  background: var(--paper);
  border: none;
  border-left: 1px solid var(--rule);
  border-radius: 0;
  padding: 0 0 0 24px;
  position: sticky;
  top: 30px;
  min-width: 0;
}

.progress-panel.collapsed {
  padding: 12px 4px;
  display: flex;
  justify-content: center;
}

.panel-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 4px 10px;
  font-size: 0.8em;
  white-space: nowrap;
  cursor: pointer;
}

.panel-toggle:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.progress-panel.collapsed .panel-toggle {
  writing-mode: vertical-rl;
  padding: 10px 4px;
}

.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

/* ---------- progress bars (20 cells, one per 5%) ---------- */

.progress-numbers {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  /* the 62px number's tight line-height (0.85) lets its glyphs visually
     spill past its line box — this needs to be generous or the bar right
     below ends up overlapped */
  margin-bottom: 22px;
}

.progress-percent {
  font-family: var(--font-heading);
  font-size: 62px;
  font-weight: 600;
  line-height: 0.85;
}

.progress-percent .unit {
  font-size: 20px;
  font-weight: 600;
}

.progress-count {
  font-family: var(--font-heading);
  font-size: 0.85em;
  color: var(--muted);
  white-space: nowrap;
}

.bar-20 {
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  gap: 3px;
}

.memo-bar {
  height: 26px;
  margin-bottom: 14px;
}

.memo-bar .bar-cell {
  background: var(--fill);
}

.memo-bar .bar-cell.filled {
  background: var(--steel);
}

.important-strip-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.important-strip-label {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 0.78em;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.important-strip {
  flex: 1;
  height: 10px;
}

.important-strip .bar-cell {
  box-shadow: inset 0 0 0 1px var(--fill);
}

.important-strip .bar-cell.filled {
  box-shadow: inset 0 0 0 1px var(--ink);
}

.important-strip-pct {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 0.78em;
  color: var(--muted);
}

.progress-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8em;
  color: var(--muted);
  margin-bottom: 14px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-swatch {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
}

.legend-swatch.legend-memo {
  background: var(--steel);
}

.legend-swatch.legend-important {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--ink);
}

.legend-swatch.legend-unmemo {
  background: var(--fill);
}

.forecast-section {
  margin-bottom: 14px;
}

/* The bars are bottom-aligned in a fixed-height row and each carries a count
   label above it, so the whole block grows upward — the title needs real
   clearance beneath it or the tallest bar's number rides up into it. */
.forecast-title {
  font-family: var(--font-heading);
  font-size: 0.78em;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 14px;
}

/* min-height, not height: a column is bar(<=48) + count + day label, which
   is taller than any fixed 66px box — with a hard height the extra spilled
   upward over the section title. */
.forecast-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  min-height: 66px;
}

.forecast-bar-value {
  font-family: var(--font-heading);
  font-size: 0.75em;
  font-weight: 600;
  color: var(--steel-txt);
}

.forecast-bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  justify-content: flex-end;
}

.forecast-bar {
  width: 100%;
  background: var(--steel);
}

.forecast-bar.empty {
  background: var(--fill);
}

.forecast-bar-label {
  font-family: var(--font-heading);
  font-size: 0.68em;
  color: var(--muted);
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 7px 6px;
  border-radius: 0;
  font-size: 0.92em;
}

.stat-row small {
  color: var(--muted);
  font-weight: 400;
}

.stat-row.clickable {
  cursor: pointer;
}

.stat-row.clickable:hover {
  background: var(--fill);
}

.stat-row.active {
  background: var(--steel-soft);
  color: var(--steel-txt);
  font-weight: 700;
}

.cat-stats {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cat-stat {
  border-radius: 0;
  padding: 4px;
}

.cat-stat-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 4px 6px;
  font-size: 0.9em;
}

.cat-fold-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 24px;
  min-height: 24px;
  margin-left: -4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  line-height: 1;
  padding: 2px;
  transition: transform 0.15s ease;
}

.cat-fold-btn.collapsed {
  transform: rotate(-90deg);
}

.cat-fold-btn:hover {
  color: var(--steel-txt);
}

.cat-stat-name {
  flex: 0 1 auto;
  min-width: 0;
  min-height: 24px;
  display: inline-flex;
  align-items: center;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 700;
  cursor: pointer;
}

.cat-stat-name:hover {
  color: var(--steel-txt);
}

.cat-stat-name.active {
  color: var(--steel-txt);
}

.cat-stat-bar {
  flex: 1;
  height: 4px;
  background: var(--fill);
  min-width: 40px;
}

.cat-stat-bar-fill {
  display: block;
  height: 100%;
  background: var(--steel);
}

.cat-stat-rate {
  flex: 0 0 auto;
  color: var(--steel-txt);
  font-weight: 700;
  font-family: var(--font-heading);
}

.cat-chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 2px 4px 4px;
}

.cat-chip {
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 3px 9px;
  font-size: 0.78em;
  font-weight: 600;
  cursor: pointer;
}

.cat-chip:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.cat-chip.active {
  background: var(--steel-soft);
  border-color: var(--steel);
  color: var(--steel-txt);
}

/* ---------- export / advanced-search / help modals ---------- */

/* Clicking the dimmed area closes the modal, so it has to read as clickable. */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, var(--ink) 45%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
}

.modal-backdrop .modal {
  cursor: auto;
}

.modal {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  width: min(420px, 92vw);
  max-height: 85vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: var(--shadow-lg);
  animation: riseIn 0.18s ease-out;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 1.1em;
  margin-bottom: 14px;
}

.modal-close {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  line-height: 1;
}

.modal-close:hover {
  color: var(--ink);
}

.modal-section {
  margin-bottom: 16px;
}

.modal-section-title {
  font-weight: 700;
  font-size: 0.88em;
  color: var(--muted);
  margin-bottom: 8px;
}

.chip-group {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-btn {
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 5px 12px;
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
}

.chip-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.chip-btn.active {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

/* "오늘 복습 N" specifically fills steel (not ink) when there's something
   due — a distinct accent from the ink-filled toggles above */
.chip-btn.due-active,
.drawer-settings-btn.due-active {
  background: var(--steel-solid);
  border-color: var(--steel-solid);
  color: var(--on-steel-solid);
}

.modal-empty {
  color: var(--muted);
  font-size: 0.9em;
}

.help-list {
  margin: 0;
  padding-left: 18px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 0.9em;
  color: var(--ink);
}

.help-list li {
  line-height: 1.45;
}

.help-list b {
  color: var(--steel-txt);
}

.help-list code {
  background: var(--fill);
  padding: 1px 5px;
  border-radius: 0;
  font-family: monospace;
}

.modal-hint {
  margin-top: 8px;
  font-size: 0.82em;
  color: var(--muted);
  line-height: 1.4;
}

.modal-hint code {
  background: var(--fill);
  padding: 1px 5px;
  border-radius: 0;
  font-family: monospace;
}

.modal-hint-error {
  color: var(--danger);
}

.search-input-invalid {
  border-color: var(--danger) !important;
}

.modal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 8px;
  border-top: 1px solid var(--rule);
}

.export-count-preview {
  font-size: 0.85em;
  color: var(--muted);
}

/* ---------- SRS review session ----------
   Renders inside .main (see render()'s main-session branch) — the toolbar
   above it stays visible, only the feed+progress area is replaced. */

.main.main-session {
  grid-template-columns: 1fr;
}

/* Centered card of its own width — the feed's full-bleed width would leave
   the border running to the far edge of a wide screen. */
.session-screen {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
  border: 1px solid var(--rule);
  padding: 26px 30px 30px;
  animation: riseIn 0.18s ease-out;
}

.session-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 24px;
}

.session-title {
  font-weight: 700;
  flex: 0 0 auto;
}

.session-count {
  font-family: var(--font-heading);
  color: var(--muted);
  flex: 0 0 auto;
}

.session-strip {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  gap: 3px;
  height: 6px;
  overflow: hidden;
}

.session-strip-cell {
  flex: 1;
  background: var(--fill);
}

.session-strip-cell.done {
  background: var(--steel);
}

.session-close-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.85em;
  cursor: pointer;
}

.session-close-btn:hover {
  color: var(--ink);
}

.session-body {
  padding: 10px 0 26px;
}

.session-word-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 20px;
}

.session-word {
  font-size: 44px;
  font-weight: 600;
  letter-spacing: -0.03em;
  word-break: keep-all;
}

.session-category {
  font-family: var(--font-heading);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.session-reveal-btn {
  border: 1px dashed var(--rule);
  background: transparent;
  color: var(--muted);
  padding: 10px 20px;
  font-size: 0.9em;
  font-weight: 600;
  cursor: pointer;
}

.session-reveal-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.session-meanings {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.session-meaning .meaning {
  font-size: 18px;
}

.session-meaning .example {
  font-size: 14px;
}

.session-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  border-top: 1px solid var(--rule-soft);
  padding-top: 20px;
}

.session-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.session-important-active {
  color: var(--ink);
  border-color: var(--ink);
}

.session-key-hints {
  font-size: 0.8em;
  color: var(--muted);
}

.session-complete {
  text-align: center;
  padding: 50px 0;
}

.session-complete-line {
  font-size: 1.1em;
  font-weight: 600;
  margin-bottom: 24px;
}

.session-complete-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

@media (max-width: 900px) {
  .main {
    grid-template-columns: 1fr;
  }
  .progress-panel {
    position: static;
    width: 100% !important;
  }
}

/* ---------- mobile layout ----------
   One source of truth, keyed on `body.is-mobile` — set by render() from
   isMobileLayout(), which already folds together the real viewport
   (portrait <=560w / landscape <=560h) and the manual PC/모바일 override.
   Keeping this on a class instead of in @media is what lets the forced
   choice and the natural breakpoint share the exact same rules, rather
   than two copies that drift apart (they already had). A resize listener
   re-renders when the answer flips, so the class never goes stale. */

.mobile-topbar,
.mobile-bottom-bar,
.mobile-drawer-backdrop,
.settings-sheet-backdrop {
  display: none;
}

body.is-mobile .toolbar,
body.is-mobile .progress-panel {
  display: none;
}

body.is-mobile {
  font-size: 14px;
}

body.is-mobile #app {
  width: 100%;
  max-width: 100%;
  /* bottom padding clears the fixed bottom bar */
  padding: 8px 8px 76px;
  gap: 8px;
}

body.is-mobile .main {
  grid-template-columns: 1fr;
}

body.is-mobile .cards {
  grid-template-columns: 1fr !important;
}

body.is-mobile .word-card {
  min-height: auto;
}

body.is-mobile .feed-panel {
  padding: 0;
}

/* A landscape phone is wide enough for two columns even though it's still
   "mobile" by every other measure. */
@media (orientation: landscape) {
  body.is-mobile .cards {
    grid-template-columns: repeat(2, 1fr) !important;
  }
}

/* ---------- top bar ---------- */

body.is-mobile .mobile-topbar {
  display: flex;
  align-items: baseline;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: 10px 2px;
}

body.is-mobile .mobile-topbar-title {
  flex: 0 0 auto;
  font-size: 17px;
  font-weight: 600;
}

body.is-mobile .mobile-word-count {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 12px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

/* Sits directly after "N WORDS"; the action cluster takes the auto margin
   instead so it stays pinned right. */
body.is-mobile .mobile-progress-num {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 22px;
  font-weight: 600;
  line-height: 1;
}

<script>
// Decode a CSV file's raw bytes, auto-detecting UTF-8 vs EUC-KR (CP949).
// Windows/Excel commonly saves Korean CSVs in EUC-KR; forcing UTF-8 on those
// produces mojibake. A non-fatal UTF-8 decode that yields replacement
// characters (U+FFFD) means the bytes aren't valid UTF-8, so we retry as
// EUC-KR. A leading BOM (from UTF-8-with-BOM exports) is stripped either way.
function decodeCSVBuffer(buffer) {
  const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(buffer);
  let text = utf8;
  if (utf8.indexOf('�') !== -1) {
    try {
      text = new TextDecoder('euc-kr', { fatal: false }).decode(buffer);
    } catch (e) {
      text = utf8;
    }
  }
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  return text;
}

// Minimal CSV parser (handles quoted fields, commas/newlines inside quotes, CRLF).
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const len = text.length;

  while (i < len) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i += 2;
          continue;
        }
        inQuotes = false;
        i++;
        continue;
      }
      field += ch;
      i++;
      continue;
    }

    if (ch === '"') {
      inQuotes = true;
      i++;
      continue;
    }
    if (ch === ',') {
      row.push(field);
      field = '';
      i++;
      continue;
    }
    if (ch === '\r') {
      i++;
      continue;
    }
    if (ch === '\n') {
      row.push(field);
      rows.push(row);
      row = [];
      field = '';
      i++;
      continue;
    }
    field += ch;
    i++;
  }
  // last field/row
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}

function isTruthyFlag(v) {
  return ['1', 'true', 'yes', 'y', 'o', '참'].includes((v || '').trim().toLowerCase());
}

// A header row is optional. Columns are positional either way — always
// category,word,meaning,example in that order, regardless of what a header
// row's cells actually say; the header is only ever detected so it can be
// skipped, never to map columns by name. A file whose very first line is
// already a real word would otherwise lose that word silently.
const HEADER_CELL_WORDS = [
  'category',
  'word',
  'meaning',
  'example',
  'memorized',
  'important',
  'checked',
  '분류',
  '표제어',
  '단어',
  '뜻',
  '의미',
  '예문',
  '예시',
  '암기',
  '중요',
  '체크',
];

// Treated as a header only when the first two cells BOTH read as column
// names — one alone is too easy to hit by accident (a word could legitimately
// be "단어", and a category could legitimately be "분류").
function looksLikeHeaderRow(cols) {
  if (!cols || cols.length < 2) return false;
  const cell = (i) => (cols[i] || '').trim().toLowerCase();
  return HEADER_CELL_WORDS.includes(cell(0)) && HEADER_CELL_WORDS.includes(cell(1));
}

// Rows sharing the same category+word are grouped into one word entry with
// multiple {meaning, example} pairs. Any text content (Korean/Hanja/
// Hiragana/Latin/digits/symbols) is accepted as-is; only a blank word is
// rejected.
//
// Optional progress-sync columns 5-7 (memorized,important,checked) let a
// CSV exported from another device carry study progress along with the
// word list. Their presence is detected from the widest row rather than
// from row 0, since row 0 may now be data rather than a header.
function rowsToWords(rows) {
  if (rows.length === 0) return [];

  const startRow = looksLikeHeaderRow(rows[0]) ? 1 : 0;
  const hasProgressCols = rows.some((r) => r.length > 4);
  const words = [];
  const byKey = new Map();
  const keyCount = new Map();

  for (let r = startRow; r < rows.length; r++) {
    const cols = rows[r];
    const category = (cols[0] || '').trim() || '미분류';
    const word = (cols[1] || '').trim();
    const meaning = (cols[2] || '').trim();
    const example = (cols[3] || '').trim();
    if (!word) continue;

    const baseKey = `${category}::${word}`;
    let entry = byKey.get(baseKey + '#last');
    if (!entry) {
      const n = keyCount.get(baseKey) || 0;
      keyCount.set(baseKey, n + 1);
      const id = n === 0 ? baseKey : `${baseKey}::${n}`;
      entry = {
        id,
        category,
        word,
        meanings: [],
        importedProgress: hasProgressCols
          ? { memorized: false, important: false, checked: [] }
          : null,
      };
      words.push(entry);
      byKey.set(baseKey + '#last', entry);
    }

    if (meaning || example) entry.meanings.push({ meaning, example });

    if (hasProgressCols) {
      entry.importedProgress.memorized = isTruthyFlag(cols[4]);
      entry.importedProgress.important = isTruthyFlag(cols[5]);
      if (meaning || example) entry.importedProgress.checked.push(isTruthyFlag(cols[6]));
    }
  }

  return words;
}

function parseCSVToWords(text) {
  return rowsToWords(parseCSV(text));
}

function csvField(value) {
  let str = String(value == null ? '' : value);
  // CSV/formula injection guard: a field starting with =, +, -, or @ gets
  // interpreted as a formula by Excel/Sheets when the file is opened there.
  // Since exported words can come from someone else's meaning/example text,
  // prefix a leading apostrophe to force plain-text — invisible in normal
  // CSV consumers, and it's exactly what spreadsheet apps expect to force
  // text formatting anyway.
  if (/^[=+\-@]/.test(str)) {
    str = "'" + str;
  }
  if (/[",\n\r]/.test(str)) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

// Inverse of parseCSVToWords: one row per {meaning, example} pair (or a
// single blank-meaning row for words with no meanings recorded). Also
// carries each word's study progress (memorized/important, plus per-meaning
// checked state) in trailing columns so the file can be re-imported — on
// this device or another — with progress intact.
function wordsToCSV(words, progress) {
  const lines = ['category,word,meaning,example,memorized,important,checked'];
  const flag = (b) => (b ? '1' : '0');
  for (const w of words) {
    const p = (progress && progress[w.id]) || { memorized: false, important: false, checked: [] };
    const wordFlags = [flag(p.memorized), flag(p.important)];
    if (w.meanings.length === 0) {
      lines.push([csvField(w.category), csvField(w.word), '', '', ...wordFlags, ''].join(','));
      continue;
    }
    w.meanings.forEach((m, i) => {
      lines.push(
        [
          csvField(w.category),
          csvField(w.word),
          csvField(m.meaning),
          csvField(m.example),
          ...wordFlags,
          flag(Boolean(p.checked[i])),
        ].join(',')
      );
    });
  }
  return '\uFEFF' + lines.join('\r\n');
}

<script>
// Persistence layer: localStorage-backed settings / word data / per-word progress.

const STORAGE_KEYS = {
  words: 'vocabApp.words',
  progress: 'vocabApp.progress',
  settings: 'vocabApp.settings',
};

// Bump whenever a stored shape changes and add a step to PROGRESS_MIGRATIONS
// / SETTINGS_MIGRATIONS (keyed by the version the step upgrades *to*) rather
// than special-casing old saves inline elsewhere — runMigrations() replays
// only the steps a given save is actually behind on.
const SCHEMA_VERSION = 2;

const DAY_MS = 24 * 60 * 60 * 1000;
const SRS_INTERVAL_DAYS = [1, 2, 4, 8, 16, 32]; // stage 1..6 -> days until next due

function todayMidnight() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

// version 1 -> 2: SRS fields (stage/due) didn't exist before — backfill so
// every record has them. A word already marked memorized is assumed to be
// reasonably well known already (stage 2, due in that stage's interval);
// anything else starts as due immediately (stage 0, due today), same as a
// brand-new word.
const PROGRESS_MIGRATIONS = {
  2: (progress) => {
    const midnight = todayMidnight();
    for (const id of Object.keys(progress)) {
      const p = progress[id];
      if (typeof p.stage !== 'number') p.stage = p.memorized ? 2 : 0;
      if (typeof p.due !== 'number') {
        p.due = p.stage > 0 ? midnight + SRS_INTERVAL_DAYS[p.stage - 1] * DAY_MS : midnight;
      }
    }
  },
};

// No settings fields have needed a migration yet — the structure is here so
// the next field addition follows the same pattern as PROGRESS_MIGRATIONS.
const SETTINGS_MIGRATIONS = {};

// Runs every step strictly after `fromVersion` up to SCHEMA_VERSION, in
// order, mutating `subject` in place. A save already at SCHEMA_VERSION runs
// nothing.
function runMigrations(migrations, fromVersion, subject) {
  for (let v = fromVersion + 1; v <= SCHEMA_VERSION; v++) {
    const step = migrations[v];
    if (step) step(subject);
  }
  return subject;
}

const DEFAULT_SETTINGS = {
  darkMode: false,
  fontSize: 15, // px, 12-22 (card body text size)
  mode: 'memorize', // 'memorize' | 'meaning-test' | 'word-test'
  cols: 3, // 1-5
  count: 3, // 1-15, cards per feed page
  examples: true, // show/hide example sentences on cards
  device: 'auto', // 'auto' | 'pc' | 'mobile' — 'auto' follows the real viewport; the toolbar toggle forces the other one
  progressCollapsed: false,
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.warn('Failed to read', key, e);
    return fallback;
  }
}

function writeJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('Failed to write', key, e);
  }
}

function loadWords() {
  return readJSON(STORAGE_KEYS.words, []);
}

function saveWords(words) {
  writeJSON(STORAGE_KEYS.words, words);
}

// Stored as { schema, data } so the version lives alongside the map rather
// than inside it (a reserved key in the {id: progress} map itself would
// collide with real word ids). A save from before this wrapper existed is
// the bare {id: progress} map at schema 1.
function loadProgress() {
  const raw = readJSON(STORAGE_KEYS.progress, null);
  if (!raw) return {};
  const hasWrapper = raw && typeof raw === 'object' && typeof raw.schema === 'number';
  const fromVersion = hasWrapper ? raw.schema : 1;
  const data = hasWrapper ? raw.data || {} : raw;
  return runMigrations(PROGRESS_MIGRATIONS, fromVersion, data);
}

function saveProgress(progress) {
  writeJSON(STORAGE_KEYS.progress, { schema: SCHEMA_VERSION, data: progress });
}

function loadSettings() {
  const raw = readJSON(STORAGE_KEYS.settings, {});
  const fromVersion = typeof raw.schema === 'number' ? raw.schema : 1;
  runMigrations(SETTINGS_MIGRATIONS, fromVersion, raw);
  raw.schema = SCHEMA_VERSION; // now current, whether or not any step actually ran
  return Object.assign({}, DEFAULT_SETTINGS, raw);
}

function saveSettings(settings) {
  writeJSON(STORAGE_KEYS.settings, Object.assign({ schema: SCHEMA_VERSION }, settings));
}

function defaultProgressFor(word) {
  return {
    memorized: false, // 미암기(false) / 암기(true)
    important: false,
    checked: (word.meanings || []).map(() => false),
    stage: 0, // 0-6, spaced-repetition step — see SRS_INTERVAL_DAYS
    due: todayMidnight(), // epoch ms; a new word is due for review immediately
  };
}

};

const SEARCH_SCOPE_OPTIONS = [
  { value: 'word-meaning', label: '표제어+뜻' },
  { value: 'word', label: '표제어' },
  { value: 'meaning', label: '뜻' },
];

const NEW_WORD_CATEGORY = '생성 단어';

resyncProgress(words);

// ---------- state helpers ----------

function resyncProgress(list) {
  let changed = false;
  const seen = new Set();
  for (const w of list) {
    seen.add(w.id);

    // A CSV carrying progress columns (e.g. exported from another device)
    // always wins for words it names — that's the point of syncing. The
    // CSV format has no stage/due (see csv.js), so those aren't part of what
    // "wins" here — carry over the existing SRS schedule if there was one,
    // otherwise fall back to the same defaults the migration in store.js
    // uses for a word with no history.
    if (w.importedProgress) {
      const ip = w.importedProgress;
      const existing = progress[w.id];
      const memorized = Boolean(ip.memorized);
      progress[w.id] = {
        memorized,
        important: Boolean(ip.important),
        checked: w.meanings.map((_, i) => Boolean(ip.checked[i])),
        stage: existing ? existing.stage : memorized ? 2 : 0,
        due: existing
          ? existing.due
          : memorized
          ? todayMidnight() + SRS_INTERVAL_DAYS[1] * DAY_MS
          : todayMidnight(),
      };
      changed = true;
      continue;
    }

    let p = progress[w.id];
    if (!p) {
      p = defaultProgressFor(w);
      progress[w.id] = p;
      changed = true;
      continue;
    }
    if (!Array.isArray(p.checked) || p.checked.length !== w.meanings.length) {
      p.checked = w.meanings.map((_, i) => Boolean(p.checked && p.checked[i]));
      changed = true;
    }
  }
  for (const id of Object.keys(progress)) {
    if (!seen.has(id)) {
      delete progress[id];
      changed = true;
    }
  }
  if (changed) saveProgress(progress);
}

function setWords(newWords) {
  words = newWords;
  resyncProgress(words);
  saveWords(words);
  ui.activeCategory = null;
  ui.filterMode = null;
  ui.exportCategories = null;
  deactivateShuffle();
  resetPaging();
  render();
}

// New-word ids only need to be unique and stable — never regenerated from
// the (editable) word text — so progress/selection stay attached to the
// right card even after the user retypes the headword.
function makeNewWordId() {
  return 'new::' + Date.now() + '::' + Math.random().toString(36).slice(2, 8);
}

// If a specific category was the whole reason the feed narrowed down to
// what's visible, the new word joins it — otherwise (viewing "전체", or a
// search that could span several categories) there's no single obvious
// category to drop it in, so it goes to its own NEW_WORD_CATEGORY instead.
// Either way, the view is switched to exactly that category afterward so
// the blank card is immediately visible and ready to type into.
function createNewWord() {
  pushEditHistory();
  const useSpecificCategory = !isSearchActive() && Boolean(ui.activeCategory);
  const category = useSpecificCategory ? ui.activeCategory : NEW_WORD_CATEGORY;
  const id = makeNewWordId();
  const newWord = { id, category, word: '', meanings: [{ meaning: '', example: '' }], importedProgress: null };
  words.push(newWord);
  progress[id] = defaultProgressFor(newWord);
  saveWords(words);
  saveProgress(progress);

  if (!useSpecificCategory) {
    ui.search.query = '';
    ui.search.memorized = false;
    ui.search.unmemorized = false;
    ui.search.important = false;
    ui.search.categories = null;
    ui.activeCategory = category;
    ui.filterMode = null;
    deactivateShuffle();
  }
  resetPaging();

  const displayList = getDisplayWords();
  const ordinal = displayList.findIndex((w) => w.id === id) + 1;
  if (ordinal > 0) jumpToWordOrdinal(ordinal);
  else render();

  requestAnimationFrame(() => {
    const input = document.querySelector(`.edit-word-input[data-id="${id}"]`);
    if (input) input.focus();
  });
}

// Run when edit mode turns off: a "+ 새 뜻 추가" row nobody typed anything
// into (meaning and example both still blank) is dropped rather than
// saved as a permanent empty entry. Doesn't touch words with zero
// meanings to begin with — that's a normal, pre-existing state, not
// leftover cruft from this session.
function cleanupBlankMeanings() {
  let changed = false;
  for (const w of words) {
    const kept = w.meanings.filter((m) => (m.meaning || '').trim() || (m.example || '').trim());
    if (kept.length !== w.meanings.length) {
      w.meanings = kept;
      changed = true;
    }
  }
  if (changed) saveWords(words);
}

// ---------- edit mode: undo history ----------
// Snapshots go in before an editing-type change (word/category/meaning text,
// add/delete meaning, add/delete word, reorder) — never for study-progress
// changes (memorized/important/checked), which aren't part of editing at
// all. A continuous run of typing is one step: see the 'input' listener
// below, which only calls this once per 1.2s-idle burst rather than per
// keystroke.
const EDIT_HISTORY_LIMIT = 30;

function pushEditHistory() {
  ui.editHistory.push({
    words: JSON.parse(JSON.stringify(words)),
    progress: JSON.parse(JSON.stringify(progress)),
  });
  if (ui.editHistory.length > EDIT_HISTORY_LIMIT) ui.editHistory.shift();
}

function undoEdit() {
  if (!ui.editHistory.length) return;
  const snapshot = ui.editHistory.pop();
  words = snapshot.words;
  progress = snapshot.progress;
  saveWords(words);
  saveProgress(progress);
  ui.editSelectedIds = new Set();
  render();
}

// Shared by every edit-field's 'input' listener so a burst of keystrokes —
// even across different fields/rows — collapses into a single undo step.
// Only the first keystroke after 1.2s of quiet pushes a snapshot; the
// pending timer just marks "still mid-burst".
// Single reorder path shared by the drag handler and the ↑/↓ buttons —
// WCAG 2.2 AA requires a non-drag way to do any author-controlled drag
// operation, and routing both through here keeps the two from drifting
// apart (numbering, checked state, and undo snapshot all move together).
// toIndex is the final position *after* the item is removed.
function moveMeaning(id, fromIndex, toIndex) {
  const w = words.find((x) => x.id === id);
  if (!w) return false;
  if (toIndex < 0 || toIndex >= w.meanings.length || toIndex === fromIndex) return false;

  pushEditHistory();
  const [movedMeaning] = w.meanings.splice(fromIndex, 1);
  w.meanings.splice(toIndex, 0, movedMeaning);

  // checked state (and thus each meaning's numbering) rides along with it
  const p = progress[id];
  if (p && Array.isArray(p.checked)) {
    const [movedChecked] = p.checked.splice(fromIndex, 1);
    p.checked.splice(toIndex, 0, movedChecked);
  }

  saveWords(words);
  saveProgress(progress);
  render();
  return true;
}

let editHistoryTypingTimer = null;

function noteEditHistoryTyping() {
  if (editHistoryTypingTimer === null) pushEditHistory();
  clearTimeout(editHistoryTypingTimer);
  editHistoryTypingTimer = setTimeout(() => {
    editHistoryTypingTimer = null;
  }, 1200);
}

function getCategories() {
  const seen = [];
  const set = new Set();
  for (const w of words) {
    if (!set.has(w.category)) {
      set.add(w.category);
      seen.push(w.category);
    }
  }
  return seen;
}

function isMemorized(word) {
  const p = progress[word.id];
  return Boolean(p && p.memorized);
}

// Shared by every trigger for these two toggles — PC keyboard shortcuts
// (Space/Enter) and mobile gestures (double-tap/long-press) alike, since
// there's no longer a button in the card markup to hang a click handler on.
// Memorized and the per-meaning checks are two views of the same judgment,
// so they're kept in lockstep in both directions: flipping the word-level
// toggle drives every check to that value (here), and checking the last
// remaining meaning flips the word to memorized (see setMeaningChecked).
function toggleMemorized(id) {
  const p = progress[id];
  if (!p) return;
  p.memorized = !p.memorized;
  if (Array.isArray(p.checked)) p.checked = p.checked.map(() => p.memorized);
  saveProgress(progress);
  render();
}

// The other half of that pairing. Only *completing* the set turns memorized
// on, and unchecking any one turns it back off — so the word-level state
// never claims more than the checks actually support.
function setMeaningChecked(id, index, value) {
  const p = progress[id];
  if (!p || !Array.isArray(p.checked)) return;
  p.checked[index] = value;
  const total = p.checked.length;
  p.memorized = total > 0 && p.checked.every(Boolean);
  saveProgress(progress);
  render();
}

function toggleImportant(id) {
  const p = progress[id];
  if (!p) return;
  p.important = !p.important;
  saveProgress(progress);
  render();
}

// 20-cell bar, one cell per 5% — filled count always floors from the raw
// ratio (never from an already-rounded display percentage), so a cell only
// fills once its full 5% share is reached. See computeStats' memoBarFilled/
// importantBarFilled.
function barFilledCount(count, total) {
  if (!total) return 0;
  return Math.floor(((count / total) * 100) / 5);
}

// 7 buckets — today, +1 .. +6 — counting how many words are due on each of
// the next 7 calendar days. Anything already overdue (due before today's
// start — shouldn't normally happen, but "다시 보기" sets due=now which can
// be any moment today) lands in the "today" bucket rather than being
// dropped or going negative.
function computeForecast() {
  const midnight = todayMidnight();
  const counts = new Array(7).fill(0);
  for (const w of words) {
    const p = progress[w.id];
    if (!p) continue;
    const dayOffset = Math.floor((p.due - midnight) / DAY_MS);
    counts[Math.max(0, Math.min(6, dayOffset))]++;
  }
  return counts;
}

// Cleared at the top of every render() — several panels (progress panel,
// mobile top bar, mobile sheet) all want the same numbers within one pass,
// and recomputing is O(words × categories), which is real work on a
// multi-thousand-word list.
let statsCache = null;

function computeStats() {
  if (statsCache) return statsCache;
  statsCache = computeStatsUncached();
  return statsCache;
}

function computeStatsUncached() {
  const total = words.length;
  const memorized = words.filter(isMemorized).length;
  const unmemorized = total - memorized;
  const important = words.filter((w) => progress[w.id] && progress[w.id].important).length;

  const byCategory = getCategories().map((cat) => {
    const inCat = words.filter((w) => w.category === cat);
    const memoInCat = inCat.filter(isMemorized).length;
    return {
      category: cat,
      total: inCat.length,
      memorized: memoInCat,
      rate: inCat.length ? Math.round((memoInCat / inCat.length) * 100) : 0,
      unmemorized: inCat.length - memoInCat,
      important: inCat.filter((w) => progress[w.id] && progress[w.id].important).length,
    };
  });

  return {
    total,
    memorized,
    memoRate: total ? Math.round((memorized / total) * 100) : 0,
    memoBarFilled: barFilledCount(memorized, total),
    unmemorized,
    // "중요" is independent of memorized — its own 20-cell strip/percentage,
    // never derived from or combined with the memorized ratio.
    important,
    importantRate: total ? Math.round((important / total) * 100) : 0,
    importantBarFilled: barFilledCount(important, total),
    byCategory,
    forecast: computeForecast(),
  };
}

// ---------- SRS (spaced repetition) ----------

// Strictly "due right now" — no fallback — so the toolbar/drawer badge
// never counts words that only show up because the queue would otherwise
// be empty (see dueWords() below, which does fall back).
function countDueToday() {
  const now = Date.now();
  return words.filter((w) => progress[w.id] && progress[w.id].due <= now).length;
}

// The actual session queue: due words first (earliest due first), or — if
// nothing is due — unmemorized words, so a caught-up learner can still
// start a session instead of hitting an empty one.
function dueWords() {
  const now = Date.now();
  const due = words.filter((w) => progress[w.id] && progress[w.id].due <= now);
  if (due.length) return due.sort((a, b) => progress[a.id].due - progress[b.id].due);
  return words.filter((w) => !isMemorized(w));
}

function startSession() {
  const queue = dueWords().map((w) => w.id);
  if (!queue.length) return;
  ui.session = { queue, i: 0, revealed: false, known: 0, again: 0, finished: false };
  ui.editMode = false; // a session and the edit table don't coexist
  ui.mobileDrawerOpen = false;
  render();
}

function sessionReveal() {
  const s = ui.session;
  if (!s || s.finished) return;
  s.revealed = true;
  render();
}

function advanceSession() {
  const s = ui.session;
  s.i++;
  s.revealed = false;
  if (s.i >= s.queue.length) s.finished = true;
  render();
}

function sessionKnow() {
  const s = ui.session;
  if (!s || s.finished) return;
  const p = progress[s.queue[s.i]];
  if (p) {
    p.stage = Math.min(6, p.stage + 1);
    p.due = Date.now() + SRS_INTERVAL_DAYS[p.stage - 1] * DAY_MS;
    saveProgress(progress);
  }
  s.known++;
  advanceSession();
}

function sessionAgain() {
  const s = ui.session;
  if (!s || s.finished) return;
  const p = progress[s.queue[s.i]];
  if (p) {
    p.stage = 0;
    p.due = Date.now();
    saveProgress(progress);
  }
  s.again++;
  advanceSession();
}

function endSession() {
  ui.session = null;
  render();
}

function matchesFilter(word, filter) {
  const p = progress[word.id];
  if (filter === 'unmemorized') return !p || !p.memorized;
  if (filter === 'important') return Boolean(p && p.important);
  return true;
}

function getFilteredWords() {
  let list = words;
  if (ui.activeCategory) list = list.filter((w) => w.category === ui.activeCategory);
  if (ui.filterMode) list = list.filter((w) => matchesFilter(w, ui.filterMode));
  return list;
}

// True once any advanced filter departs from its default (all categories,
// no memorized/important checkbox, regex mode on) — used both to decide
// whether a search is "active" with an empty query, and to badge the
// advanced-search button.
function isSearchAdvancedActive() {
  const s = ui.search;
  if (s.memorized || s.unmemorized || s.important || !s.useRegex) return true;
  if (s.categories) {
    const allCats = getCategories();
    if (s.categories.size !== allCats.length) return true;
  }
  return false;
}

// A search is "active" the moment it would actually narrow or reorder the
// feed — either real query text, or a non-default advanced filter. This
// lets the advanced panel's checkboxes work on their own, with an empty
// query text treated as "match everything" within the scope.
function isSearchActive() {
  return Boolean(ui.search.query.trim()) || isSearchAdvancedActive();
}

// null when there's no query to validate, or when it isn't in regex mode —
// both cases where "is the pattern valid" doesn't apply.
function searchRegexError() {
  const s = ui.search;
  if (!s.useRegex || !s.query.trim()) return null;
  try {
    new RegExp(s.query.trim());
    return null;
  } catch (err) {
    return err.message;
  }
}

function matchesSearchScope(word, scope, matcher) {
  const wordMatch = matcher(word.word);
  const meaningMatch = word.meanings.some((m) => matcher(m.meaning || ''));
  if (scope === 'word') return wordMatch;
  if (scope === 'meaning') return meaningMatch;
  return wordMatch || meaningMatch;
}

// Search results are grouped by category (in the same order categories
// otherwise appear throughout the app) and sorted alphabetically within
// each group — a fixed, predictable order rather than the feed's normal
// category-tab/shuffle-driven display, which this bypasses entirely while
// a search is active (see getDisplayWords below).
//
// Regex mode is on by default; "정규식 미사용" in advanced search opts back
// out to plain substring matching — with it off, "*", ".", "\" etc. in a
// query are just literal characters to look for, never special syntax. An
// invalid pattern (regex mode only) matches nothing rather than throwing or
// silently falling back to a literal search.
function getSearchResults() {
  const s = ui.search;
  const query = s.query.trim();
  const cats = s.categories;
  const categoryOrder = new Map(getCategories().map((c, i) => [c, i]));

  let matcher = () => true; // no query — everything passes this stage
  let regexInvalid = false;
  if (query) {
    if (s.useRegex) {
      try {
        const re = new RegExp(query, 'i');
        matcher = (text) => re.test(text);
      } catch (err) {
        regexInvalid = true;
      }
    } else {
      const q = query.toLowerCase();
      matcher = (text) => text.toLowerCase().includes(q);
    }
  }

  if (regexInvalid) return [];

  return words
    .filter((w) => {
      if (cats && !cats.has(w.category)) return false;
      if (!matchesSearchScope(w, s.scope, matcher)) return false;
      const p = progress[w.id];
      if (s.memorized || s.unmemorized) {
        const isMemo = Boolean(p && p.memorized);
        const memoOk = (s.memorized && isMemo) || (s.unmemorized && !isMemo);
        if (!memoOk) return false;
      }
      if (s.important && !(p && p.important)) return false;
      return true;
    })
    .sort((a, b) => {
      const catDiff = (categoryOrder.get(a.category) || 0) - (categoryOrder.get(b.category) || 0);
      if (catDiff !== 0) return catDiff;
      return a.word.localeCompare(b.word, 'ko');
    });
}

// Filtered range, reordered per the active shuffle snapshot (if any). Stats
// always read the plain word list / getFilteredWords(), never this — only
// display order for the feed itself is affected by shuffling. A search in
// progress takes over the source list entirely, ahead of category tab /
// filter-mode / shuffle — those resume once the search is cleared.
function getDisplayWords() {
  if (isSearchActive()) return getSearchResults();
  const filtered = getFilteredWords();
  if (!ui.shuffleActive || !ui.shuffledIds) return filtered;
  const byId = new Map(filtered.map((w) => [w.id, w]));
  return ui.shuffledIds.map((id) => byId.get(id)).filter(Boolean);
}

function deactivateShuffle() {
  ui.shuffleActive = false;
  ui.shuffledIds = null;
}

function currentPageNumber() {
  return Math.floor(ui.startIndex / settings.count) + 1;
}

function totalPageCount() {
  return Math.max(1, Math.ceil(getDisplayWords().length / settings.count));
}

function gotoPage(pageNum) {
  const total = totalPageCount();
  const clamped = Math.max(1, Math.min(total, pageNum));
  ui.startIndex = (clamped - 1) * settings.count;
  ui.revealedIds.clear();
  ui.focusedIndex = null;
  render();
}

function jumpToWordOrdinal(n) {
  const filtered = getDisplayWords();
  if (!Number.isFinite(n) || filtered.length === 0) return;
  const clamped = Math.max(1, Math.min(filtered.length, Math.floor(n)));
  const index = clamped - 1;
  ui.startIndex = Math.floor(index / settings.count) * settings.count;
  ui.focusedIndex = index - ui.startIndex;
  ui.revealedIds.clear();
  render();
}

function toggleShuffle() {
  if (ui.shuffleActive) {
    ui.startIndex = ui.preShuffleStartIndex || 0;
    deactivateShuffle();
  } else {
    const ids = getFilteredWords().map((w) => w.id);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = ids[i];
      ids[i] = ids[j];
      ids[j] = tmp;
    }
    ui.shuffledIds = ids;
    ui.preShuffleStartIndex = ui.startIndex;
    ui.shuffleActive = true;
    ui.startIndex = 0;
  }
  ui.revealedIds.clear();
  ui.focusedIndex = null;
  render();
}

function clampStartIndex(filteredLen) {
  if (filteredLen === 0) {
    ui.startIndex = 0;
    return;
  }
  if (ui.startIndex > filteredLen - 1) ui.startIndex = Math.max(0, filteredLen - 1);
  if (ui.startIndex < 0) ui.startIndex = 0;
}

function resetPaging() {
  ui.startIndex = 0;
  ui.revealedIds.clear();
  ui.focusedIndex = null;
}

// ---------- rendering ----------

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Every icon in the app renders through this — a single Lucide set (no
// emoji, no ad-hoc inline SVGs) so the icon language stays consistent.
// lucide.createIcons() (called at the end of render()) swaps each
// <i data-lucide="..."> placeholder for the matching inline SVG.
function icon(name, size) {
  return `<i data-lucide="${name}" width="${size}" height="${size}" stroke-width="1.5"></i>`;
}

function render() {
  statsCache = null; // stats are recomputed once per render, then shared
  document.body.classList.toggle('dark', settings.darkMode);
  // Single switch every mobile CSS rule keys off — covers both the real
  // viewport and the manual override (see isMobileLayout).
  document.body.classList.toggle('is-mobile', isMobileLayout());

  document.documentElement.style.setProperty('--card-font-size', settings.fontSize + 'px');
  // Headword tracks the body size but at a damped rate (0.6×), so it always
  // stays clearly larger than the meanings instead of the two converging.
  // Clamped so the extremes of the 12–22 range can't run away.
  const headword = Math.round(
    Math.min(32, Math.max(22, 26 + (settings.fontSize - DEFAULT_SETTINGS.fontSize) * 0.6))
  );
  document.documentElement.style.setProperty('--card-headword-size', headword + 'px');

  const app = document.getElementById('app');

  const filtered = getDisplayWords();
  clampStartIndex(filtered.length);
  const windowWords = filtered.slice(ui.startIndex, ui.startIndex + settings.count);
  if (ui.focusedIndex !== null && ui.focusedIndex >= windowWords.length) {
    ui.focusedIndex = windowWords.length ? windowWords.length - 1 : null;
  }

  // Progress panel is a fixed-width column of the 2-column .main grid; the
  // feed takes the remaining 1fr. Cards inside the feed are minmax(0,1fr)
  // tracks, so nothing here needs to solve for a card width in pixels —
  // #app just gets a max-width from CSS and the grid divides what's left.
  const progressW = settings.progressCollapsed ? 40 : 268;

  const mainInnerHtml = ui.session
    ? renderSessionView()
    : renderFeedPanel(filtered, windowWords) + renderProgressPanel();

  app.innerHTML =
    renderMobileTopBar() +
    renderToolbar() +
    renderViewOptionsRow() +
    `<div class="main ${ui.session ? 'main-session' : ''}" style="--progress-w: ${progressW}px;">` +
    mainInnerHtml +
    '</div>' +
    (ui.session || ui.editMode ? '' : renderMobileBottomBar(filtered.length)) +
    renderMobileDrawer() +
    renderSettingsSheet() +
    (ui.exportOpen ? renderExportPanel() : '') +
    (ui.search.advancedOpen ? renderAdvancedSearchPanel() : '') +
    (ui.helpOpen ? renderHelpPanel() : '');

  // Edit fields need their height set from actual rendered content (font
  // metrics/wrapping aren't known until they're in the DOM), so this can't
  // happen as part of the HTML string above — it has to run after
  // insertion. Only matters in edit mode; harmless no-op otherwise since
  // no .edit-field elements exist.
  if (ui.editMode) autoResizeEditFields();

  // Swap every <i data-lucide="..."> placeholder just inserted above for
  // its real inline SVG.
  if (window.lucide) lucide.createIcons();
}

// scrollHeight measures the content+padding box, but these fields are
// box-sizing:border-box (global reset), where the `height` CSS property
// includes the border too — setting height straight to scrollHeight comes
// up one border-width short on each edge, clipping the last line by a
// couple px. Reading the actual border width (rather than hardcoding the
// CSS's current 1px) keeps this correct if that ever changes.
function autoResizeField(el) {
  const cs = getComputedStyle(el);
  const borderY = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + borderY + 'px';
}

function autoResizeEditFields() {
  document.querySelectorAll('.edit-field').forEach(autoResizeField);
}

// Label/icon always show the DESTINATION — what clicking switches you TO —
// never the current state. Showing "PC" while already on PC (a real past
// bug) meant clicking it flipped you to mobile, which read as exactly
// backwards: a button that says PC should be the one that gets you to PC.
function renderDeviceToggleButton(extraClass, showLabel) {
  const goingToMobile = !isMobileLayout();

// Fixed bar at the bottom of the mobile viewport: mode segment + paging.
// Paging here is prev/next only — the numbered pagination stays in the feed
// body; this is the thumb-reachable copy.
function renderMobileBottomBar(filteredLen) {
  const totalPages = Math.max(1, Math.ceil(filteredLen / settings.count));
  const currentPage = Math.min(totalPages, currentPageNumber());
  return `
  <div class="mobile-bottom-bar">
    ${renderModeSegment()}
    <div class="mobile-page-nav">
      <button class="mobile-page-btn" data-action="page-prev" ${
        currentPage <= 1 ? 'disabled' : ''
      } aria-label="이전 페이지">${icon('chevron-left', 15)}</button>
      <span class="mobile-page-label">${currentPage} / ${totalPages}</span>
      <button class="mobile-page-btn" data-action="page-next" ${
        currentPage >= totalPages ? 'disabled' : ''
      } aria-label="다음 페이지">${icon('chevron-right', 15)}</button>
    </div>
  </div>`;
}

// Full-screen takeover while ui.session is active — see render()'s early
// return. Rendered instead of (never alongside) the toolbar/feed/progress
// panel.
function renderSessionView() {
  const s = ui.session;

  // Skip past any queued id that no longer exists (e.g. deleted mid-session)
  // by advancing the plain state in place — not via advanceSession(), which
  // calls render() itself and would race with the render() call already in
  // progress for this pass.
  while (!s.finished && !words.some((w) => w.id === s.queue[s.i])) {
    s.i++;
    s.revealed = false;
    if (s.i >= s.queue.length) s.finished = true;
  }

  if (s.finished) {
    const stats = computeStats();
    return `
    <div class="session-screen session-complete">
      <div class="session-complete-line">암기함 ${s.known} · 다시 보기 ${s.again} — 진행률 ${stats.memoRate}%</div>
      <div class="session-complete-actions">
        <button class="btn btn-primary" data-action="session-restart">남은 단어로 다시</button>
        <button class="btn" data-action="end-session">단어장으로</button>
      </div>
    </div>`;
  }

  const id = s.queue[s.i];
  const word = words.find((w) => w.id === id);
  const p = progress[id] || defaultProgressFor(word);

  // One cell per queued word only while that stays a sane number of nodes —
  // a 3000-word queue would emit 3000 cells whose gaps alone are wider than
  // the screen, which stretched the whole session box and pushed the close
  // button off-view. Past the cap the strip becomes proportional instead.
  const STRIP_MAX_CELLS = 40;
  const stripCells = Math.min(s.queue.length, STRIP_MAX_CELLS);
  const stripDone =
    s.queue.length <= STRIP_MAX_CELLS ? s.i : Math.floor((s.i / s.queue.length) * STRIP_MAX_CELLS);
  const stripHtml = Array.from(
    { length: stripCells },
    (_, i) => `<div class="session-strip-cell ${i < stripDone ? 'done' : ''}"></div>`
  ).join('');

  const bodyHtml = s.revealed
    ? `<div class="session-meanings">${word.meanings
        .map(
          (m, i) => `
        <div class="session-meaning">
          ${m.meaning ? `<div class="meaning">${i + 1}. ${escapeHtml(m.meaning)}</div>` : ''}
          ${m.example ? `<div class="example">${escapeHtml(m.example)}</div>` : ''}
        </div>`
        )
        .join('')}</div>`
    : `<button class="session-reveal-btn" data-action="session-reveal">뜻 보기 (Space)</button>`;

  return `
  <div class="session-screen">
    <div class="session-header">
      <span class="session-title">복습 세션</span>
      <span class="session-count">${s.i + 1} / ${s.queue.length}</span>
      <div class="session-strip">${stripHtml}</div>
      <button class="session-close-btn" data-action="end-session">${icon('x', 15)} 세션 종료</button>
    </div>
    <div class="session-body">
      <div class="session-word-row">
        <span class="session-word">${escapeHtml(word.word)}</span>
        <span class="session-category">${escapeHtml(word.category)}</span>
      </div>
      ${bodyHtml}
    </div>
    <div class="session-footer">
      <div class="session-actions">
        <button class="btn btn-primary" data-action="session-know">${icon('check', 15)} 암기함</button>
        <button class="btn" data-action="session-again">${icon('rotate-ccw', 15)} 다시 보기</button>
        <button class="btn ${p.important ? 'session-important-active' : ''}" data-action="session-toggle-important" data-id="${escapeHtml(
    id
  )}">${icon('bookmark', 15)} 중요</button>
      </div>
      <div class="session-key-hints">Space 뜻 · Enter 암기함 · → 다시 보기</div>
    </div>
  </div>`;
}

// Progress only — settings moved out to its own sheet (the sliders button),
