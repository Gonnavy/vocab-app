<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>단어장</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#5980a6" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap"
  rel="stylesheet"
/>
<script src="https://unpkg.com/lucide@0.451.0/dist/umd/lucide.js"></script>
<style>
:root {
  /* card-scoped font (font-size control only affects word-card text) */
  --card-font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  --card-font-size: 15px;
  /* numbers/labels — mixed into Korean text, falls back per-character for
     the glyphs it doesn't cover (Barlow Condensed is Latin/digits only) */
  --font-heading: 'Barlow Condensed', 'IBM Plex Sans KR', sans-serif;

  --paper: #f2f2f3;
  --ink: #1d1f20;
  --steel: #5980a6;
  --steel-txt: #3f6485;
  --steel-fill: color-mix(in srgb, var(--steel) 8%, var(--paper));
  --steel-soft: color-mix(in srgb, var(--steel) 12%, var(--paper));
  --important-underline: color-mix(in srgb, var(--steel) 45%, var(--paper));
  --rule: color-mix(in srgb, var(--ink) 22%, transparent);
  --rule-soft: color-mix(in srgb, var(--ink) 12%, transparent);
  --rule-strong: color-mix(in srgb, var(--ink) 35%, transparent);
  --muted: #5b5e62;
  --muted-2: #838689;
  --fill: color-mix(in srgb, var(--ink) 12%, transparent);
  --danger: #e5484d;
  --danger-soft: #fde8e8;
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.3);
}

body.dark {
  --paper: #17181a;
  --ink: #f0f1f2;
  --steel: #7ea6c9;
  --steel-txt: #7ea6c9;
  --steel-fill: color-mix(in srgb, var(--steel) 12%, var(--paper));
  --steel-soft: color-mix(in srgb, var(--steel) 16%, var(--paper));
  --important-underline: color-mix(in srgb, var(--steel) 55%, var(--paper));
  --rule: color-mix(in srgb, var(--ink) 24%, transparent);
  --rule-soft: color-mix(in srgb, var(--ink) 13%, transparent);
  --rule-strong: color-mix(in srgb, var(--ink) 38%, transparent);
  --muted: #9aa0a6;
  --muted-2: #7d8288;
  --fill: color-mix(in srgb, var(--ink) 15%, transparent);
  --danger: #ff6b6b;
  --danger-soft: #4a2323;
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: var(--paper);
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  font-size: 15px;
  transition: background 0.15s ease, color 0.15s ease;
}

button,
select,
input {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--steel);
  outline-offset: 2px;
}

/* Every icon is a Lucide SVG swapped in for a <i data-lucide="..."> placeholder
   at render time (see icon() / lucide.createIcons() in app.js) — one
   consistent icon language, no emoji or ad-hoc inline SVGs. */
svg.lucide {
  display: inline-block;
  flex-shrink: 0;
  vertical-align: middle;
}

#app {
  width: fit-content;
  max-width: calc(100vw - 24px);
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ---------- toolbar ---------- */

.toolbar {
  position: relative;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 12px 16px 16px;
}

.toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 18px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  border-radius: 0;
  padding: 6px 14px;
  cursor: pointer;
  font-weight: 600;
}

.btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.btn-primary {
  background: var(--steel);
  border-color: var(--steel);
  color: #fff;
}

.btn-primary:hover {
  opacity: 0.9;
  color: #fff;
}

.opt {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.9em;
  color: var(--muted);
  white-space: nowrap;
}

.opt select {
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 3px 6px;
  background: var(--paper);
  color: var(--ink);
}

.stepper {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.stepper button {
  width: 24px;
  height: 24px;
  border-radius: 0;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  cursor: pointer;
  line-height: 1;
}

.stepper button:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.stepper-value {
  min-width: 1.5em;
  text-align: center;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-heading);
}

/* icon-only toggle (dark mode) — square hit target, centered icon */
.icon-toggle-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 6px 10px;
}

/* ---------- layout ---------- */

.main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--progress-w, 260px);
  gap: 16px;
  align-items: start;
  max-width: 100%;
}

.feed-panel {
  min-width: 0;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 16px;
}

.feed-header-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 12px;
}

.feed-header {
  font-weight: 700;
  font-size: 1.15em;
}

.current-category-label {
  font-size: 0.85em;
  color: var(--muted);
  font-weight: 600;
}

/* ---------- search bar (rendered once for PC, once for mobile — see
   renderSearchBar; only one copy is visible per breakpoint) ---------- */

.search-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.feed-header-row .search-bar {
  margin-left: auto;
}

.search-scope {
  flex: 0 0 auto;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 4px 6px;
  background: var(--paper);
  color: var(--ink);
  font-size: 0.85em;
}

.search-input {
  flex: 0 1 180px;
  min-width: 80px;
  border: none;
  border-bottom: 1px solid var(--rule-strong);
  border-radius: 0;
  padding: 5px 4px;
  background: transparent;
  color: var(--ink);
  font-size: 0.9em;
}

.search-advanced-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 4px 9px;
  cursor: pointer;
}

.search-advanced-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.search-advanced-btn.active {
  border-color: var(--steel);
  color: var(--steel-txt);
  background: var(--steel-soft);
}

.position-indicator {
  font-size: 0.85em;
  font-family: var(--font-heading);
  color: var(--muted);
  margin-bottom: 12px;
}

/* ---------- feed / cards ---------- */

.feed-nav-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.jump-box {
  grid-column: 1;
  justify-self: start;
  flex: 0 0 auto;
}

.jump-input {
  width: 70px;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 5px 8px;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-heading);
}

.pagination-bar {
  grid-column: 2;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
  justify-content: center;
}

.page-nav-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 4px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink);
  border-radius: 0;
  cursor: pointer;
}

.page-nav-btn:hover:not(:disabled) {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.page-nav-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.page-num-list {
  display: flex;
  align-items: center;
  gap: 2px;
}

.page-num-btn {
  flex: 0 0 auto;
  min-width: 26px;
  height: 26px;
  padding: 0 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  border-radius: 0;
  cursor: pointer;
  font-size: 0.82em;
  font-variant-numeric: tabular-nums;
  font-family: var(--font-heading);
}

.page-num-btn:hover {
  background: var(--fill);
  color: var(--ink);
}

.page-num-btn.current {
  background: var(--steel);
  color: #fff;
  font-weight: 700;
}

.cards {
  min-width: 0;
  display: grid;
  gap: 0;
  border-top: 1px solid var(--rule);
  border-left: 1px solid var(--rule-soft);
  align-content: start;
  /* Without this, a touch drag here is ambiguous to the browser (the page
     also scrolls vertically) and it can claim the gesture as a native
     scroll mid-swipe, cancelling the pointer sequence before our swipe
     handler's pointerup ever fires. pan-y keeps vertical scrolling native
     while forcing horizontal movement to stay under JS control. */
  touch-action: pan-y;
}

.cards-empty {
  color: var(--muted);
  padding: 40px 0;
  text-align: center;
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.cards-empty p {
  margin: 0;
}

/* ---------- word card (a "단" of the dictionary page, not a boxed card:
   no rounding, no shadow, no fill of its own — state is fill/weight, and
   its only edges are the shared rule lines from .cards above) ---------- */

.word-card {
  min-width: 0;
  font-family: var(--card-font-family);
  font-size: var(--card-font-size);
  font-weight: 400;
  border-right: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  border-radius: 0;
  padding: 18px 20px 22px 18px;
  min-height: 250px;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  background: transparent;
  touch-action: pan-y;
}

.word-card.memorized {
  background: var(--steel-fill);
}

/* 표제어 앞 9px 스틸 사각 — memorized marker, drawn without extra markup */
.word-card.memorized .card-word-text::before {
  content: '';
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 7px;
  background: var(--steel);
  vertical-align: middle;
}

.word-card.focused {
  position: relative;
  z-index: 2;
  box-shadow: inset 0 0 0 1px var(--steel);
}

/* ---------- edit mode ---------- */

.word-card.editable {
  position: relative;
  cursor: default;
  gap: 10px;
}

.word-card.edit-selected {
  box-shadow: inset 0 0 0 2px var(--danger);
  background: var(--danger-soft);
}

.card-edit-delete {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 26px;
  height: 26px;
  border: 2px solid var(--danger);
  border-radius: 0;
  background: var(--paper);
  color: var(--danger);
  font-size: 1em;
  line-height: 1;
  cursor: pointer;
  z-index: 1;
}

.card-edit-delete:hover {
  background: var(--danger-soft);
}

.edit-field {
  width: 100%;
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 8px 10px;
  background: var(--paper);
  color: var(--ink);
  font-family: inherit;
  font-size: inherit;
  /* height is driven entirely by JS (see autoResizeEditFields / the
     'input' listener) to track content the way the normal card's static
     text just wraps and grows — overflow:hidden keeps no stray scrollbar
     flashing in the moment before each resize catches up, and resize:none
     avoids a manual drag-handle fighting the auto-grow on the next
     keystroke. */
  overflow: hidden;
  resize: none;
}

.edit-word-input {
  font-size: 1.3em;
  font-weight: 800;
  text-align: center;
  padding-right: 34px;
}

.edit-meanings {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.edit-meaning-row {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

.edit-meaning-index {
  flex: 0 0 auto;
  padding-top: 8px;
  color: var(--muted);
}

.edit-meaning-fields {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.edit-example-input {
  font-size: 0.9em;
  color: var(--muted);
}

.edit-add-meaning-btn {
  flex: 0 0 auto;
  align-self: center;
  margin-top: 4px;
  border: 1px dashed var(--rule);
  border-radius: 0;
  padding: 6px 14px;
  background: transparent;
  color: var(--muted);
  font-size: 0.85em;
  font-weight: 600;
  cursor: pointer;
}

.edit-add-meaning-btn:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.edit-add-card-btn,
.edit-trash-btn {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 0;
  cursor: pointer;
  font-size: 1em;
  line-height: 1;
}

.edit-add-card-btn {
  border: 2px solid var(--steel);
  background: var(--paper);
  color: var(--steel-txt);
}

.edit-add-card-btn:hover {
  background: var(--steel-soft);
}

.edit-trash-btn {
  border: 2px solid var(--danger);
  background: var(--paper);
  color: var(--danger);
  opacity: 0.5;
}

.edit-trash-btn.has-selection {
  opacity: 1;
}

.edit-trash-btn:hover {
  background: var(--danger-soft);
}

.card-word {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: 6px;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: -0.02em;
  padding: 0 0 12px;
  margin-bottom: 10px;
}

.card-word.important .card-word-text {
  box-shadow: inset 0 -12px 0 var(--important-underline);
}

.card-bookmark {
  grid-column: 1;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  color: var(--muted);
  opacity: 0.25;
}

.card-bookmark.active {
  opacity: 1;
  color: var(--ink);
}

.card-word-text {
  grid-column: 2;
  text-align: center;
  word-break: keep-all;
  white-space: nowrap;
  overflow-wrap: anywhere;
}

.card-word.placeholder {
  display: block;
  text-align: center;
  color: var(--muted);
  font-weight: 500;
  font-size: 1em;
}

.dict-link {
  grid-column: 3;
  justify-self: start;
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  color: var(--muted);
  opacity: 0.5;
  transition: opacity 0.15s ease, color 0.15s ease;
}

.dict-link:hover {
  opacity: 1;
  color: var(--steel-txt);
}

.card-meanings {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  touch-action: pan-y;
}

.meanings-placeholder,
.meaning-empty {
  color: var(--muted);
  text-align: center;
  padding: 24px 8px;
  font-size: 0.9em;
}

.meaning-item {
  display: flex;
  gap: 4px;
  align-items: flex-start;
}

.check-btn {
  flex: 0 0 auto;
  border: none;
  background: transparent;
  padding: 0;
  margin: 0;
  color: var(--muted);
  font-family: var(--font-heading);
  font-size: 14px;
  font-weight: 600;
  line-height: inherit;
  white-space: nowrap;
  cursor: pointer;
}

.check-btn:hover {
  color: var(--steel-txt);
}

.check-btn.checked {
  color: var(--steel-txt);
}

.meaning-text {
  flex: 1;
  min-width: 0;
}

.meaning {
  font-weight: 400;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.example {
  font-size: 13.5px;
  color: var(--muted);
  margin-top: 2px;
  overflow-wrap: anywhere;
}

.meaning-item.checked .meaning,
.meaning-item.checked .example {
  color: var(--muted);
  text-decoration: line-through;
  font-weight: 400;
}

/* ---------- progress panel ---------- */

.progress-panel {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 0;
  padding: 16px;
  position: sticky;
  top: 16px;
  min-width: 0;
}

.progress-panel.collapsed {
  padding: 12px 4px;
  display: flex;
  justify-content: center;
}

.panel-toggle {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--muted);
  border-radius: 0;
  padding: 4px 10px;
  font-size: 0.8em;
  white-space: nowrap;
  cursor: pointer;
}

.panel-toggle:hover {
  border-color: var(--steel);
  color: var(--steel-txt);
}

.progress-panel.collapsed .panel-toggle {
  writing-mode: vertical-rl;
  padding: 10px 4px;
}

.toolbar.collapsed {
  padding: 8px 16px;
}

.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 700;
  font-size: 1.15em;
  margin-bottom: 12px;
}

/* ---------- progress bars (20 cells, one per 5%) ---------- */

.progress-numbers {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}

.progress-percent {
  font-family: var(--font-heading);
  font-size: 62px;
  font-weight: 600;
  line-height: 0.85;
}

.progress-percent .unit {
  font-size: 20px;
  font-weight: 600;
}

.progress-count {
  font-family: var(--font-heading);
  font-size: 0.85em;
  color: var(--muted);
  white-space: nowrap;
}

.bar-20 {
  display: grid;
  grid-template-columns: repeat(20, 1fr);
  gap: 3px;
}

.memo-bar {
  height: 26px;
  margin-bottom: 14px;
}

.memo-bar .bar-cell {
  background: var(--fill);
}

.memo-bar .bar-cell.filled {
  background: var(--steel);
}

.important-strip-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.important-strip-label {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 0.78em;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
}

.important-strip {
  flex: 1;
  height: 10px;
}

.important-strip .bar-cell {
  box-shadow: inset 0 0 0 1px var(--fill);
}

.important-strip .bar-cell.filled {
  box-shadow: inset 0 0 0 1px var(--ink);
}

.important-strip-pct {
  flex: 0 0 auto;
  font-family: var(--font-heading);
  font-size: 0.78em;
  color: var(--muted);
}

.progress-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 0.8em;
  color: var(--muted);
  margin-bottom: 14px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.legend-swatch {
  width: 9px;
  height: 9px;
  flex: 0 0 auto;
}

.legend-swatch.legend-memo {
  background: var(--steel);
}

.legend-swatch.legend-important {
  background: transparent;
  box-shadow: inset 0 0 0 1px var(--ink);
}

.legend-swatch.legend-unmemo {
  background: var(--fill);
}

.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 7px 6px;
  border-radius: 0;
  font-size: 0.92em;
}

.stat-row small {
  color: var(--muted);
  font-weight: 400;
}

.stat-row.clickable {
  cursor: pointer;
}

.stat-row.clickable:hover {
  background: var(--fill);
}

.stat-row.active {
  background: var(--steel-soft);
  color: var(--steel-txt);
  font-weight: 700;
}

.cat-stats {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cat-stat {
  border-radius: 0;
  padding: 4px;
}

.cat-stat-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 4px 6px;
  font-size: 0.9em;
}

.cat-fold-btn {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;

<script>
// Decode a CSV file's raw bytes, auto-detecting UTF-8 vs EUC-KR (CP949).
// Windows/Excel commonly saves Korean CSVs in EUC-KR; forcing UTF-8 on those
// produces mojibake. A non-fatal UTF-8 decode that yields replacement
// characters (U+FFFD) means the bytes aren't valid UTF-8, so we retry as
// EUC-KR. A leading BOM (from UTF-8-with-BOM exports) is stripped either way.
function decodeCSVBuffer(buffer) {
  const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(buffer);
  let text = utf8;
  if (utf8.indexOf('�') !== -1) {
    try {
      text = new TextDecoder('euc-kr', { fatal: false }).decode(buffer);
    } catch (e) {
      text = utf8;
    }
  }
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  return text;
}

// Minimal CSV parser (handles quoted fields, commas/newlines inside quotes, CRLF).
function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const len = text.length;

  while (i < len) {
    const ch = text[i];

    if (inQuotes) {
      if (ch === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i += 2;
          continue;
        }
        inQuotes = false;
        i++;
        continue;
      }
      field += ch;
      i++;
      continue;
    }

    if (ch === '"') {
      inQuotes = true;
      i++;
      continue;
    }
    if (ch === ',') {
      row.push(field);
      field = '';
      i++;
      continue;
    }
    if (ch === '\r') {
      i++;
      continue;
    }
    if (ch === '\n') {
      row.push(field);
      rows.push(row);
      row = [];
      field = '';
      i++;
      continue;
    }
    field += ch;
    i++;
  }
  // last field/row
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}

function isTruthyFlag(v) {
  return ['1', 'true', 'yes', 'y', 'o', '참'].includes((v || '').trim().toLowerCase());
}

// Columns are positional — always category,word,meaning,example in that
// order, regardless of what the header row's cells actually say. The first
// row is always treated as a header and skipped. Rows sharing the same
// category+word are grouped into one word entry with multiple
// {meaning, example} pairs. Any text content (Korean/Hanja/Hiragana/Latin/
// digits/symbols) is accepted as-is; only a blank word is rejected.
//
// Optional progress-sync columns 5-7 (memorized,important,checked) let a
// CSV exported from another device carry study progress along with the
// word list. Their presence is detected from the header row's column count
// so plain word-list CSVs (no such columns) are unaffected — imported words
// then get importedProgress=null and fall back to local defaults.
function rowsToWords(rows) {
  if (rows.length === 0) return [];

  const hasProgressCols = rows[0].length > 4;
  const words = [];
  const byKey = new Map();
  const keyCount = new Map();

  for (let r = 1; r < rows.length; r++) {
    const cols = rows[r];
    const category = (cols[0] || '').trim() || '미분류';
    const word = (cols[1] || '').trim();
    const meaning = (cols[2] || '').trim();
    const example = (cols[3] || '').trim();
    if (!word) continue;

    const baseKey = `${category}::${word}`;
    let entry = byKey.get(baseKey + '#last');
    if (!entry) {
      const n = keyCount.get(baseKey) || 0;
      keyCount.set(baseKey, n + 1);
      const id = n === 0 ? baseKey : `${baseKey}::${n}`;
      entry = {
        id,
        category,
        word,
        meanings: [],
        importedProgress: hasProgressCols
          ? { memorized: false, important: false, checked: [] }
          : null,
      };
      words.push(entry);
      byKey.set(baseKey + '#last', entry);
    }

    if (meaning || example) entry.meanings.push({ meaning, example });

    if (hasProgressCols) {
      entry.importedProgress.memorized = isTruthyFlag(cols[4]);
      entry.importedProgress.important = isTruthyFlag(cols[5]);
      if (meaning || example) entry.importedProgress.checked.push(isTruthyFlag(cols[6]));
    }
  }

  return words;
}

function parseCSVToWords(text) {
  return rowsToWords(parseCSV(text));
}

function csvField(value) {
  let str = String(value == null ? '' : value);
  // CSV/formula injection guard: a field starting with =, +, -, or @ gets
  // interpreted as a formula by Excel/Sheets when the file is opened there.
  // Since exported words can come from someone else's meaning/example text,
  // prefix a leading apostrophe to force plain-text — invisible in normal
  // CSV consumers, and it's exactly what spreadsheet apps expect to force
  // text formatting anyway.
  if (/^[=+\-@]/.test(str)) {
    str = "'" + str;
  }
  if (/[",\n\r]/.test(str)) {
    return '"' + str.replace(/"/g, '""') + '"';
  }
  return str;
}

// Inverse of parseCSVToWords: one row per {meaning, example} pair (or a
// single blank-meaning row for words with no meanings recorded). Also
// carries each word's study progress (memorized/important, plus per-meaning
// checked state) in trailing columns so the file can be re-imported — on
// this device or another — with progress intact.
function wordsToCSV(words, progress) {
  const lines = ['category,word,meaning,example,memorized,important,checked'];
  const flag = (b) => (b ? '1' : '0');
  for (const w of words) {
    const p = (progress && progress[w.id]) || { memorized: false, important: false, checked: [] };
    const wordFlags = [flag(p.memorized), flag(p.important)];
    if (w.meanings.length === 0) {
      lines.push([csvField(w.category), csvField(w.word), '', '', ...wordFlags, ''].join(','));
      continue;
    }
    w.meanings.forEach((m, i) => {
      lines.push(
        [
          csvField(w.category),
          csvField(w.word),
          csvField(m.meaning),
          csvField(m.example),
          ...wordFlags,
          flag(Boolean(p.checked[i])),
        ].join(',')
      );
    });
  }
  return '\uFEFF' + lines.join('\r\n');
}
</script>
<script>
// Persistence layer: localStorage-backed settings / word data / per-word progress.

const STORAGE_KEYS = {
  words: 'vocabApp.words',
  progress: 'vocabApp.progress',
  settings: 'vocabApp.settings',
};

const DEFAULT_SETTINGS = {
  darkMode: false,
  fontSize: 15, // px, 12-22 (card body text size)
  mode: 'memorize', // 'memorize' | 'meaning-test' | 'word-test'
  cols: 3, // 1-5
  count: 3, // 1-15, cards per feed page
  toolbarCollapsed: false,
  progressCollapsed: false,
};

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    console.warn('Failed to read', key, e);
    return fallback;
  }
}

function writeJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('Failed to write', key, e);
  }
}

function loadWords() {
  return readJSON(STORAGE_KEYS.words, []);
}

function saveWords(words) {
  writeJSON(STORAGE_KEYS.words, words);
}

function loadProgress() {
  return readJSON(STORAGE_KEYS.progress, {});
}

function saveProgress(progress) {
  writeJSON(STORAGE_KEYS.progress, progress);
}

function loadSettings() {
  const saved = readJSON(STORAGE_KEYS.settings, {});
  return Object.assign({}, DEFAULT_SETTINGS, saved);
}

function saveSettings(settings) {
  writeJSON(STORAGE_KEYS.settings, settings);
}

function defaultProgressFor(word) {
  return {
    memorized: false, // 미암기(false) / 암기(true)
    important: false,
    checked: (word.meanings || []).map(() => false),
  };
}

<script>
// Main application: state, rendering, event handling.
// Relies on globals from csv.js and store.js (no bundler / plain <script> includes).

const CARD_GAP = 12;
const CARD_MIN_WIDTH = 270; // floor for the always-on fit-to-width calculation

// Card width is no longer a stored preference — it's recomputed every
// render() from the available width and column count (see render()), so
// cards always exactly fill the row regardless of viewport size, cols, or
// count. Kept as a module-level var (not persisted) purely so
// renderFeedPanel() can read whatever render() just computed.
let currentCardWidth = CARD_MIN_WIDTH;

let words = loadWords();
let progress = loadProgress();
let settings = loadSettings();
const ui = {
  activeCategory: null, // null = all categories
  filterMode: null, // null | 'unmemorized' | 'important'
  startIndex: 0,
  revealedIds: new Set(), // transient: which cards are "flipped" in test modes
  focusedIndex: null, // index within current window; null = no card focused yet
  exportOpen: false,
  exportStatus: { all: true, unmemorized: false, important: false },
  exportCategories: null, // Set, lazily initialized when export panel opens
  collapsedCategories: new Set(), // category names folded in the progress panel
  shuffleActive: false,
  shuffledIds: null, // word ids in shuffled order, snapshot of the filtered range at shuffle time
  preShuffleStartIndex: 0, // restored when shuffle is toggled back off
  mobileDrawerOpen: false, // mobile-only: hamburger-triggered left drawer
  mobileDrawerView: 'progress', // 'progress' | 'settings', which drawer page is showing
  helpOpen: false,
  editMode: false,
  editSelectedIds: new Set(), // word ids marked (via drag) for bulk delete while editing
  search: {
    query: '',
    scope: 'word-meaning', // 'word-meaning' | 'word' | 'meaning'
    advancedOpen: false,
    memorized: false,
    unmemorized: false,
    important: false,
    useRegex: true, // interpret query as a regular expression instead of a literal substring (default on)
    categories: null, // Set, lazily initialized when advanced search opens
  },
};

const SEARCH_SCOPE_OPTIONS = [
  { value: 'word-meaning', label: '표제어+뜻' },
  { value: 'word', label: '표제어' },
  { value: 'meaning', label: '뜻' },
];

const NEW_WORD_CATEGORY = '생성 단어';

resyncProgress(words);

// ---------- state helpers ----------

function resyncProgress(list) {
  let changed = false;
  const seen = new Set();
  for (const w of list) {
    seen.add(w.id);

    // A CSV carrying progress columns (e.g. exported from another device)
    // always wins for words it names — that's the point of syncing.
    if (w.importedProgress) {
      const ip = w.importedProgress;
      progress[w.id] = {
        memorized: Boolean(ip.memorized),
        important: Boolean(ip.important),
        checked: w.meanings.map((_, i) => Boolean(ip.checked[i])),
      };
      changed = true;
      continue;
    }

    let p = progress[w.id];
    if (!p) {
      p = defaultProgressFor(w);
      progress[w.id] = p;
      changed = true;
      continue;
    }
    if (!Array.isArray(p.checked) || p.checked.length !== w.meanings.length) {
      p.checked = w.meanings.map((_, i) => Boolean(p.checked && p.checked[i]));
      changed = true;
    }
  }
  for (const id of Object.keys(progress)) {
    if (!seen.has(id)) {
      delete progress[id];
      changed = true;
    }
  }
  if (changed) saveProgress(progress);
}

function setWords(newWords) {
  words = newWords;
  resyncProgress(words);
  saveWords(words);
  ui.activeCategory = null;
  ui.filterMode = null;
  ui.exportCategories = null;
  deactivateShuffle();
  resetPaging();
  render();
}

// New-word ids only need to be unique and stable — never regenerated from
// the (editable) word text — so progress/selection stay attached to the
// right card even after the user retypes the headword.
function makeNewWordId() {
  return 'new::' + Date.now() + '::' + Math.random().toString(36).slice(2, 8);
}

// If a specific category was the whole reason the feed narrowed down to
// what's visible, the new word joins it — otherwise (viewing "전체", or a
// search that could span several categories) there's no single obvious
// category to drop it in, so it goes to its own NEW_WORD_CATEGORY instead.
// Either way, the view is switched to exactly that category afterward so
// the blank card is immediately visible and ready to type into.
function createNewWord() {
  const useSpecificCategory = !isSearchActive() && Boolean(ui.activeCategory);
  const category = useSpecificCategory ? ui.activeCategory : NEW_WORD_CATEGORY;
  const id = makeNewWordId();
  const newWord = { id, category, word: '', meanings: [{ meaning: '', example: '' }], importedProgress: null };
  words.push(newWord);
  progress[id] = defaultProgressFor(newWord);
  saveWords(words);
  saveProgress(progress);

  if (!useSpecificCategory) {
    ui.search.query = '';
    ui.search.memorized = false;
    ui.search.unmemorized = false;
    ui.search.important = false;
    ui.search.categories = null;
    ui.activeCategory = category;
    ui.filterMode = null;
    deactivateShuffle();
  }
  resetPaging();

  const displayList = getDisplayWords();
  const ordinal = displayList.findIndex((w) => w.id === id) + 1;
  if (ordinal > 0) jumpToWordOrdinal(ordinal);
  else render();

  requestAnimationFrame(() => {
    const input = document.querySelector(`.edit-word-input[data-id="${id}"]`);
    if (input) input.focus();
  });
}

// Run when edit mode turns off: a "+ 새 뜻 추가" row nobody typed anything
// into (meaning and example both still blank) is dropped rather than
// saved as a permanent empty entry. Doesn't touch words with zero
// meanings to begin with — that's a normal, pre-existing state, not
// leftover cruft from this session.
function cleanupBlankMeanings() {
  let changed = false;
  for (const w of words) {
    const kept = w.meanings.filter((m) => (m.meaning || '').trim() || (m.example || '').trim());
    if (kept.length !== w.meanings.length) {
      w.meanings = kept;
      changed = true;
    }
  }
  if (changed) saveWords(words);
}

function getCategories() {
  const seen = [];
  const set = new Set();
  for (const w of words) {
    if (!set.has(w.category)) {
      set.add(w.category);
      seen.push(w.category);
    }
  }
  return seen;
}

function isMemorized(word) {
  const p = progress[word.id];
  return Boolean(p && p.memorized);
}

// Shared by every trigger for these two toggles — PC keyboard shortcuts
// (Space/Enter) and mobile gestures (double-tap/long-press) alike, since
// there's no longer a button in the card markup to hang a click handler on.
function toggleMemorized(id) {
  const p = progress[id];
  if (!p) return;
  p.memorized = !p.memorized;
  saveProgress(progress);
  render();
}

function toggleImportant(id) {
  const p = progress[id];
  if (!p) return;
  p.important = !p.important;
  saveProgress(progress);
  render();
}

// 20-cell bar, one cell per 5% — filled count always floors from the raw
// ratio (never from an already-rounded display percentage), so a cell only
// fills once its full 5% share is reached. See computeStats' memoBarFilled/
// importantBarFilled.
function barFilledCount(count, total) {
  if (!total) return 0;
  return Math.floor(((count / total) * 100) / 5);
}

function computeStats() {
  const total = words.length;
  const memorized = words.filter(isMemorized).length;
  const unmemorized = total - memorized;
  const important = words.filter((w) => progress[w.id] && progress[w.id].important).length;

  const byCategory = getCategories().map((cat) => {
    const inCat = words.filter((w) => w.category === cat);
    const memoInCat = inCat.filter(isMemorized).length;
    return {
      category: cat,
      total: inCat.length,
      memorized: memoInCat,
      rate: inCat.length ? Math.round((memoInCat / inCat.length) * 100) : 0,
      unmemorized: inCat.length - memoInCat,
      important: inCat.filter((w) => progress[w.id] && progress[w.id].important).length,
    };
  });

  return {
    total,
    memorized,
    memoRate: total ? Math.round((memorized / total) * 100) : 0,
    memoBarFilled: barFilledCount(memorized, total),
    unmemorized,
    // "중요" is independent of memorized — its own 20-cell strip/percentage,
    // never derived from or combined with the memorized ratio.
    important,
    importantRate: total ? Math.round((important / total) * 100) : 0,
    importantBarFilled: barFilledCount(important, total),
    byCategory,
  };
}

function matchesFilter(word, filter) {
  const p = progress[word.id];
  if (filter === 'unmemorized') return !p || !p.memorized;
  if (filter === 'important') return Boolean(p && p.important);
  return true;
}

function getFilteredWords() {
  let list = words;
  if (ui.activeCategory) list = list.filter((w) => w.category === ui.activeCategory);
  if (ui.filterMode) list = list.filter((w) => matchesFilter(w, ui.filterMode));
  return list;
}

// True once any advanced filter departs from its default (all categories,
// no memorized/important checkbox, regex mode on) — used both to decide
// whether a search is "active" with an empty query, and to badge the
// advanced-search button.
function isSearchAdvancedActive() {
  const s = ui.search;
  if (s.memorized || s.unmemorized || s.important || !s.useRegex) return true;
  if (s.categories) {
    const allCats = getCategories();
    if (s.categories.size !== allCats.length) return true;
  }
  return false;
}

// A search is "active" the moment it would actually narrow or reorder the
// feed — either real query text, or a non-default advanced filter. This
// lets the advanced panel's checkboxes work on their own, with an empty
// query text treated as "match everything" within the scope.
function isSearchActive() {
  return Boolean(ui.search.query.trim()) || isSearchAdvancedActive();
}

// null when there's no query to validate, or when it isn't in regex mode —
// both cases where "is the pattern valid" doesn't apply.
function searchRegexError() {
  const s = ui.search;
  if (!s.useRegex || !s.query.trim()) return null;
  try {
    new RegExp(s.query.trim());
    return null;
  } catch (err) {
    return err.message;
  }
}

function matchesSearchScope(word, scope, matcher) {
  const wordMatch = matcher(word.word);
  const meaningMatch = word.meanings.some((m) => matcher(m.meaning || ''));
  if (scope === 'word') return wordMatch;
  if (scope === 'meaning') return meaningMatch;
  return wordMatch || meaningMatch;
}

// Search results are grouped by category (in the same order categories
// otherwise appear throughout the app) and sorted alphabetically within
// each group — a fixed, predictable order rather than the feed's normal
// category-tab/shuffle-driven display, which this bypasses entirely while
// a search is active (see getDisplayWords below).
//
// Regex mode is on by default; "정규식 미사용" in advanced search opts back
// out to plain substring matching — with it off, "*", ".", "\" etc. in a
// query are just literal characters to look for, never special syntax. An
// invalid pattern (regex mode only) matches nothing rather than throwing or
// silently falling back to a literal search.
function getSearchResults() {
  const s = ui.search;
  const query = s.query.trim();
  const cats = s.categories;
  const categoryOrder = new Map(getCategories().map((c, i) => [c, i]));

  let matcher = () => true; // no query — everything passes this stage
  let regexInvalid = false;
  if (query) {
    if (s.useRegex) {
      try {
        const re = new RegExp(query, 'i');
        matcher = (text) => re.test(text);
      } catch (err) {
        regexInvalid = true;
      }
    } else {
      const q = query.toLowerCase();
      matcher = (text) => text.toLowerCase().includes(q);
    }
  }

  if (regexInvalid) return [];

  return words
    .filter((w) => {
      if (cats && !cats.has(w.category)) return false;
      if (!matchesSearchScope(w, s.scope, matcher)) return false;
      const p = progress[w.id];
      if (s.memorized || s.unmemorized) {
        const isMemo = Boolean(p && p.memorized);
        const memoOk = (s.memorized && isMemo) || (s.unmemorized && !isMemo);
        if (!memoOk) return false;
      }
      if (s.important && !(p && p.important)) return false;
      return true;
    })
    .sort((a, b) => {
      const catDiff = (categoryOrder.get(a.category) || 0) - (categoryOrder.get(b.category) || 0);
      if (catDiff !== 0) return catDiff;
      return a.word.localeCompare(b.word, 'ko');
    });
}

// Filtered range, reordered per the active shuffle snapshot (if any). Stats
// always read the plain word list / getFilteredWords(), never this — only
// display order for the feed itself is affected by shuffling. A search in
// progress takes over the source list entirely, ahead of category tab /
// filter-mode / shuffle — those resume once the search is cleared.
function getDisplayWords() {
  if (isSearchActive()) return getSearchResults();
  const filtered = getFilteredWords();
  if (!ui.shuffleActive || !ui.shuffledIds) return filtered;
  const byId = new Map(filtered.map((w) => [w.id, w]));
  return ui.shuffledIds.map((id) => byId.get(id)).filter(Boolean);
}

function deactivateShuffle() {
  ui.shuffleActive = false;
  ui.shuffledIds = null;
}

function currentPageNumber() {
  return Math.floor(ui.startIndex / settings.count) + 1;
}

function totalPageCount() {
  return Math.max(1, Math.ceil(getDisplayWords().length / settings.count));
}

function gotoPage(pageNum) {
  const total = totalPageCount();
  const clamped = Math.max(1, Math.min(total, pageNum));
  ui.startIndex = (clamped - 1) * settings.count;
  ui.revealedIds.clear();
  ui.focusedIndex = null;
  render();
}

function jumpToWordOrdinal(n) {
  const filtered = getDisplayWords();
  if (!Number.isFinite(n) || filtered.length === 0) return;
  const clamped = Math.max(1, Math.min(filtered.length, Math.floor(n)));
  const index = clamped - 1;
  ui.startIndex = Math.floor(index / settings.count) * settings.count;
  ui.focusedIndex = index - ui.startIndex;
  ui.revealedIds.clear();
  render();
}

function toggleShuffle() {
  if (ui.shuffleActive) {
    ui.startIndex = ui.preShuffleStartIndex || 0;
    deactivateShuffle();
  } else {
    const ids = getFilteredWords().map((w) => w.id);
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = ids[i];
      ids[i] = ids[j];
      ids[j] = tmp;
    }
    ui.shuffledIds = ids;
    ui.preShuffleStartIndex = ui.startIndex;
    ui.shuffleActive = true;
    ui.startIndex = 0;
  }
  ui.revealedIds.clear();
  ui.focusedIndex = null;
  render();
}

function clampStartIndex(filteredLen) {
  if (filteredLen === 0) {
    ui.startIndex = 0;
    return;
  }
  if (ui.startIndex > filteredLen - 1) ui.startIndex = Math.max(0, filteredLen - 1);
  if (ui.startIndex < 0) ui.startIndex = 0;
}

function resetPaging() {
  ui.startIndex = 0;
  ui.revealedIds.clear();
  ui.focusedIndex = null;
}

// ---------- rendering ----------

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

const CIRCLED_NUMBERS = [
  '①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧', '⑨', '⑩',
  '⑪', '⑫', '⑬', '⑭', '⑮', '⑯', '⑰', '⑱', '⑲', '⑳',
];
function circledNumber(n) {
  return CIRCLED_NUMBERS[n - 1] || `(${n})`;
}

// Every icon in the app renders through this — a single Lucide set (no
// emoji, no ad-hoc inline SVGs) so the icon language stays consistent.
// lucide.createIcons() (called at the end of render()) swaps each
// <i data-lucide="..."> placeholder for the matching inline SVG.
function icon(name, size) {
  return `<i data-lucide="${name}" width="${size}" height="${size}" stroke-width="1.5"></i>`;
}

function render() {
  document.body.classList.toggle('dark', settings.darkMode);

  document.documentElement.style.setProperty('--card-font-size', settings.fontSize + 'px');

  const filtered = getDisplayWords();
  clampStartIndex(filtered.length);
  const windowWords = filtered.slice(ui.startIndex, ui.startIndex + settings.count);
  if (ui.focusedIndex !== null && ui.focusedIndex >= windowWords.length) {
    ui.focusedIndex = windowWords.length ? windowWords.length - 1 : null;
  }

  const progressW = settings.progressCollapsed ? 40 : 260;
  const app = document.getElementById('app');

  // documentElement.clientWidth (not CSS 100vw) — vw is defined off the
  // initial containing block and in practice doesn't subtract the vertical
  // scrollbar's own width, so a vw-based cap can still let the app render a
  // few px wider than what's actually available, which is exactly enough
  // to trigger a horizontal scrollbar. clientWidth is a real post-layout
  // measurement that already excludes the scrollbar — freshly read every
  // render, so it also reacts correctly when a `count`/`cols` change adds
  // or removes enough page height to toggle the scrollbar on or off.
  const viewportCap = document.documentElement.clientWidth - 24;

  // Card width is always computed to exactly fill the row — no manual
  // width slider or fit-toggle anymore (see the currentCardWidth note up
  // top). This solves directly for the card width that makes the cards
  // fill the target width, using the same chrome terms (#app/feed-panel
  // padding, main gaps+handle, progress panel) the width is built from
  // below, so there's no measure-the-rendered-DOM-then-fix-it-up step —
  // it's correct in one pass.
  // +4px: measured empirically — the .cards padding/negative-margin trick
  // (for focus-ring room) resolves a couple px tighter in practice than
  // the arithmetic here predicts, and without this slack the grid can end
  // up ~2px wider than its container and trigger a horizontal scrollbar.
  const nonCardsChrome = 16 * 2 + 16 + progressW + 16 * 2; // feed-panel pad + main gap + progress panel + #app pad
  const availableForCards = Math.max(0, viewportCap - nonCardsChrome);
  const rawCardWidth = Math.floor((availableForCards - (settings.cols - 1) * CARD_GAP - 4) / settings.cols);
  currentCardWidth = Math.max(CARD_MIN_WIDTH, rawCardWidth);

  // #app is sized to exactly wrap the now-computed cards, capped at the
  // viewport so it never forces page-level horizontal scroll, and centered
  // via margin:auto. Setting an explicit width here (rather than relying
  // on CSS `fit-content`) also sidesteps nested-grid intrinsic-sizing
  // quirks that didn't reliably propagate the card grid's width up through
  // .main / .feed-nav in testing — with a definite width the grid's own
  // tracks size normally.
  const cardsWidth = settings.cols * currentCardWidth + (settings.cols - 1) * CARD_GAP + 4;
  const appWidth = cardsWidth + nonCardsChrome;
  app.style.width = Math.min(appWidth, viewportCap) + 'px';
  app.innerHTML =
    renderMobileTopBar() +
    renderToolbar() +
    `<div class="main" style="--progress-w: ${progressW}px;">` +
    renderFeedPanel(filtered, windowWords) +
    renderProgressPanel() +
    '</div>' +
    renderMobileDrawer() +
    (ui.exportOpen ? renderExportPanel() : '') +
    (ui.search.advancedOpen ? renderAdvancedSearchPanel() : '') +
    (ui.helpOpen ? renderHelpPanel() : '');

  // Edit fields need their height set from actual rendered content (font
  // metrics/wrapping aren't known until they're in the DOM), so this can't
  // happen as part of the HTML string above — it has to run after
  // insertion. Only matters in edit mode; harmless no-op otherwise since
  // no .edit-field elements exist.
  if (ui.editMode) autoResizeEditFields();

  // Swap every <i data-lucide="..."> placeholder just inserted above for
  // its real inline SVG.
  if (window.lucide) lucide.createIcons();
}

// scrollHeight measures the content+padding box, but these fields are
// box-sizing:border-box (global reset), where the `height` CSS property
// includes the border too — setting height straight to scrollHeight comes
// up one border-width short on each edge, clipping the last line by a
// couple px. Reading the actual border width (rather than hardcoding the
// CSS's current 1px) keeps this correct if that ever changes.
function autoResizeField(el) {
  const cs = getComputedStyle(el);
  const borderY = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + borderY + 'px';
}

function autoResizeEditFields() {
  document.querySelectorAll('.edit-field').forEach(autoResizeField);
}

function renderMobileTopBar() {
  return `
  <div class="mobile-topbar">
    <button class="hamburger-btn" data-action="open-mobile-drawer" aria-label="메뉴 열기">${icon('menu', 20)}</button>
    <span class="mobile-topbar-title">단어장</span>
    ${renderSearchBar()}
  </div>`;
}

// Rendered twice — once for the PC placement (feed-header row) and once for
// the mobile placement (top bar) — same markup/state either way; CSS picks
// which copy is actually visible per breakpoint, same pattern as the
// desktop toolbar vs. the mobile drawer's settings view.
function renderSearchBar() {
  const scopeOptionsHtml = SEARCH_SCOPE_OPTIONS.map(
    (o) =>
      `<option value="${o.value}" ${o.value === ui.search.scope ? 'selected' : ''}>${escapeHtml(
        o.label
      )}</option>`
  ).join('');

  const regexError = searchRegexError();

  return `
  <div class="search-bar">
    <select class="search-scope" data-action="search-scope" aria-label="검색 범위">${scopeOptionsHtml}</select>
    <input type="text" class="search-input ${
      regexError ? 'search-input-invalid' : ''
    }" data-action="search-input" placeholder="검색" value="${escapeHtml(
    ui.search.query
  )}" aria-label="단어 검색" title="${regexError ? escapeHtml('잘못된 정규식: ' + regexError) : ''}" />
    <button class="search-advanced-btn ${
      isSearchAdvancedActive() ? 'active' : ''
    }" data-action="open-advanced-search" aria-label="고급 검색">${icon('sliders-horizontal', 15)}</button>
  </div>`;
}

function renderMobileDrawer() {
  if (!ui.mobileDrawerOpen) return '';
  const body = ui.mobileDrawerView === 'settings' ? renderMobileSettingsView() : renderMobileProgressView();
  return `
  <div class="mobile-drawer-backdrop" data-action="close-mobile-drawer">
    <aside class="mobile-drawer">${body}</aside>
  </div>`;
}

// Shared by the desktop progress panel and the mobile drawer's progress
// view — same stats markup either way, just wrapped in different chrome
// (panel header + collapse toggle vs. drawer header + close button).
function renderProgressBody(stats) {
  const memoBarHtml = Array.from(
    { length: 20 },
    (_, i) => `<div class="bar-cell ${i < stats.memoBarFilled ? 'filled' : ''}"></div>`
  ).join('');
  const importantBarHtml = Array.from(
    { length: 20 },
    (_, i) => `<div class="bar-cell ${i < stats.importantBarFilled ? 'filled' : ''}"></div>`
  ).join('');

  const filterRow = (label, key) => `
    <div class="stat-row clickable ${ui.filterMode === key && !ui.activeCategory ? 'active' : ''}" data-action="stat-filter" data-filter="${key}">
      <span>${label}</span>
      <span>${stats[key]}개</span>
    </div>`;

  const perCategoryHtml = stats.byCategory
    .map((c) => {
      // '' (전체) normalizes to "no filter within this category" — see the
      // stat-category-filter click handler, which does the same when
      // reading data-filter back off the button.
      const chip = (label, key, count) => {
        const isActive = ui.activeCategory === c.category && (key ? ui.filterMode === key : !ui.filterMode);
        return `<button class="cat-chip ${isActive ? 'active' : ''}" data-action="stat-category-filter" data-category="${escapeHtml(
          c.category
        )}" data-filter="${key}">${label} ${count}개</button>`;
      };
      const collapsed = ui.collapsedCategories.has(c.category);
      return `
      <div class="cat-stat">
        <div class="cat-stat-header">
          <button class="cat-fold-btn ${collapsed ? 'collapsed' : ''}" data-action="toggle-fold" data-category="${escapeHtml(
        c.category
      )}" aria-label="접기/펼치기">${icon('chevron-down', 14)}</button>
          <span class="cat-stat-name" data-action="tab" data-category="${escapeHtml(c.category)}">${escapeHtml(
        c.category
      )}</span>
          <span class="cat-stat-rate">${c.rate}%</span>
        </div>
        ${
          collapsed
            ? ''
            : `<div class="cat-chip-group">${chip('전체', '', c.total)}${chip(
                '미암기',
                'unmemorized',
                c.unmemorized
              )}${chip('중요', 'important', c.important)}</div>`
        }
      </div>`;
    })
    .join('');

  const allActive = !ui.filterMode && !ui.activeCategory;

  return `
    <div class="progress-numbers">
      <div class="progress-percent">${stats.memoRate}<span class="unit">%</span></div>
      <div class="progress-count">${stats.memorized} / ${stats.total} 단어</div>
    </div>
    <div class="bar-20 memo-bar" aria-label="암기율 ${stats.memoRate}%">${memoBarHtml}</div>
    <div class="important-strip-row">
      <span class="important-strip-label">중요</span>
      <div class="bar-20 important-strip" aria-label="중요 표시 ${stats.importantRate}%">${importantBarHtml}</div>
      <span class="important-strip-pct">${stats.importantRate}%</span>
    </div>
    <div class="progress-legend">
      <span class="legend-item"><span class="legend-swatch legend-memo"></span>암기 ${stats.memorized}</span>
      <span class="legend-item"><span class="legend-swatch legend-important"></span>중요 ${stats.important}</span>
      <span class="legend-item"><span class="legend-swatch legend-unmemo"></span>미암기 ${stats.unmemorized}</span>
    </div>
    <div class="stat-row clickable ${allActive ? 'active' : ''}" data-action="tab" data-category="">
      <span>전체 보기</span>
    </div>
    ${filterRow('미암기', 'unmemorized')}
    ${filterRow('중요', 'important')}
    <div class="cat-stats">${perCategoryHtml}</div>`;
}

function renderMobileProgressView() {
  const stats = computeStats();

  return `
    <div class="drawer-header">
      진행률
      <button class="drawer-close-btn" data-action="close-mobile-drawer" aria-label="닫기">${icon('x', 18)}</button>
    </div>
    ${renderProgressBody(stats)}
    <button class="drawer-settings-btn" data-action="open-help">${icon('circle-help', 17)} 사용법</button>
    <button class="drawer-settings-btn" data-action="open-mobile-settings">${icon('settings', 17)} 설정</button>
  `;
}

function renderMobileSettingsView() {
  const modeLabels = { memorize: '암기', 'meaning-test': '의미 테스트', 'word-test': '단어 테스트' };
  const modeOptionsHtml = Object.keys(modeLabels)
    .map(
      (m) =>
        `<option value="${m}" ${m === settings.mode ? 'selected' : ''}>${escapeHtml(
          modeLabels[m]
        )}</option>`
    )
    .join('');

  return `
    <div class="drawer-header">
      <button class="drawer-back-btn" data-action="back-to-progress" aria-label="뒤로">${icon('arrow-left', 18)}</button>
      설정
      <button class="drawer-close-btn" data-action="close-mobile-drawer" aria-label="닫기">${icon('x', 18)}</button>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">데이터</div>
      <button class="btn btn-open" data-action="open-csv">${icon('folder-open', 15)} 열기</button>
      <button class="btn" data-action="open-export">${icon('download', 15)} 내보내기</button>
    </div>
    <div class="settings-section">
      <div class="settings-section-title">화면</div>
      <button class="chip-btn icon-toggle-btn ${settings.darkMode ? 'active' : ''}" data-action="toggle-dark" aria-label="${
    settings.darkMode ? '라이트 모드로 전환' : '다크 모드로 전환'
  }">${icon(settings.darkMode ? 'moon' : 'sun', 16)}</button>
      ${stepperControl('글자 크기', settings.fontSize, 'font-size-dec', 'font-size-inc')}
    </div>
    <div class="settings-section">
      <div class="settings-section-title">레이아웃</div>
      <label class="opt">
        모드
        <select data-action="select-mode">${modeOptionsHtml}</select>
      </label>
      ${stepperControl('열', settings.cols, 'cols-dec', 'cols-inc')}
      ${stepperControl('개수', settings.count, 'count-dec', 'count-inc')}
    </div>
    <div class="settings-section">
      <div class="settings-section-title">단어 편집</div>
      <button class="chip-btn ${ui.editMode ? 'active' : ''}" data-action="toggle-edit-mode">편집 모드</button>
    </div>
  `;

// Mobile shares the same JS-render path as desktop (no separate mobile
// bundle), so this is the one spot that needs to know the viewport class —
// the pagination bar's button count/set genuinely differs by device rather
// than just its CSS presentation. Safe without a resize listener: a phone
// stays "mobile" under this query across a portrait<->landscape rotation
// (the same two breakpoints the mobile CSS uses), so it can't go stale
// between renders the way a plain max-width check would.
function isMobileLayout() {
  return window.matchMedia(
    '(orientation: portrait) and (max-width: 560px), (orientation: landscape) and (max-height: 560px)'
  ).matches;
}

function renderPaginationBar(filteredLen) {
  const mobile = isMobileLayout();
  const totalPages = Math.max(1, Math.ceil(filteredLen / settings.count));
  const currentPage = Math.min(totalPages, currentPageNumber());

  const windowSize = mobile ? 7 : 10;
  let startPage = Math.max(1, currentPage - Math.floor(windowSize / 2));
  let endPage = Math.min(totalPages, startPage + windowSize - 1);
  startPage = Math.max(1, endPage - windowSize + 1);

  let pageButtons = '';
  for (let p = startPage; p <= endPage; p++) {
    pageButtons += `<button class="page-num-btn ${
      p === currentPage ? 'current' : ''
    }" data-action="goto-page" data-page="${p}">${p}</button>`;
  }

  // Mobile drops the step/jump icon buttons entirely — swiping already
  // covers single-page stepping, and the extra icon row eats too much width
  // on a phone screen for what it adds. Just the tappable page numbers remain.
  if (mobile) {
    return `
  <div class="pagination-bar">
    <div class="page-num-list">${pageButtons}</div>
  </div>`;
  }

  const atFirst = currentPage <= 1;
  const atLast = currentPage >= totalPages;

  return `
  <div class="pagination-bar">
    <button class="page-nav-btn" data-action="page-first" ${
      atFirst ? 'disabled' : ''
    } aria-label="맨 처음 페이지">${icon('chevrons-left', 15)}</button>
    <button class="page-nav-btn" data-action="page-back5" ${
      atFirst ? 'disabled' : ''
    } aria-label="5페이지 뒤로">${icon('rewind', 15)}</button>
    <button class="page-nav-btn" data-action="page-prev" ${
      atFirst ? 'disabled' : ''
    } aria-label="이전 페이지">${icon('chevron-left', 15)}</button>
    <div class="page-num-list">${pageButtons}</div>
    <button class="page-nav-btn" data-action="page-next" ${
      atLast ? 'disabled' : ''
    } aria-label="다음 페이지">${icon('chevron-right', 15)}</button>
    <button class="page-nav-btn" data-action="page-fwd5" ${
      atLast ? 'disabled' : ''
    } aria-label="5페이지 앞으로">${icon('fast-forward', 15)}</button>
    <button class="page-nav-btn" data-action="page-last" ${
      atLast ? 'disabled' : ''
    } aria-label="맨 마지막 페이지">${icon('chevrons-right', 15)}</button>
  </div>`;
}

function renderCard(word, index, focused) {
  const p = progress[word.id] || defaultProgressFor(word);
  if (ui.editMode) return renderEditableCard(word, p, index, focused);

  const revealed = ui.revealedIds.has(word.id) || settings.mode === 'memorize';

  const wordVisible = settings.mode !== 'word-test' || revealed;
  const meaningsVisible = settings.mode !== 'meaning-test' || revealed;

  const dictUrl = 'https://dict.naver.com/dict.search?query=' + encodeURIComponent(word.word);
  const importantClass = p.important ? ' important' : '';
  const bookmarkHtml = `<span class="card-bookmark${
    p.important ? ' active' : ''
  }" aria-hidden="true">${icon('bookmark', 15)}</span>`;
  const wordHtml = wordVisible
    ? `<div class="card-word${importantClass}">${bookmarkHtml}<span class="card-word-text">${escapeHtml(
        word.word
      )}</span><a class="dict-link" href="${escapeHtml(
        dictUrl
      )}" target="_blank" rel="noopener noreferrer" title="네이버 사전에서 검색" aria-label="네이버 사전에서 검색">${icon(
        'search',
        14
      )}</a></div>`
    : `<div class="card-word placeholder${importantClass}">탭하여 단어 보기</div>`;

  let meaningsHtml;
  if (meaningsVisible) {
    meaningsHtml = word.meanings.length
      ? word.meanings
          .map((m, i) => {
            const checked = Boolean(p.checked[i]);
            return `
            <div class="meaning-item ${checked ? 'checked' : ''}">
              <button class="check-btn ${checked ? 'checked' : ''}" data-action="toggle-checked" data-id="${escapeHtml(
                word.id
              )}" data-index="${i}" aria-label="${i + 1}번 뜻 암기 확인">${i + 1}</button>
              <div class="meaning-text">
                ${m.meaning ? `<div class="meaning">${escapeHtml(m.meaning)}</div>` : ''}
                ${m.example ? `<div class="example">${escapeHtml(m.example)}</div>` : ''}
              </div>
            </div>`;
          })
          .join('')
      : '<div class="meaning-empty">등록된 뜻이 없습니다</div>';
  } else {
    meaningsHtml = `<div class="meanings-placeholder">탭하여 뜻과 예시 보기</div>`;
  }

  return `
  <div class="word-card ${focused ? 'focused' : ''} ${p.memorized ? 'memorized' : ''}" data-action="card-reveal" data-id="${escapeHtml(
    word.id
  )}" data-index="${index}">
    ${wordHtml}
    <div class="card-meanings">${meaningsHtml}</div>
  </div>`;
}

// Edit mode swaps the whole card for plain inputs/textareas instead of
// static text — see the 'focusout' handler for how edits get committed
// (on leaving a field, not per keystroke: re-rendering mid-edit would tear
// out the very field being typed into, the same class of bug the search
// box's IME composition had). A word with no meanings yet still gets one
// blank editable row so there's somewhere to type a first one.
function renderEditableCard(word, p, index, focused) {
  const selected = ui.editSelectedIds.has(word.id);
  const meanings = word.meanings.length ? word.meanings : [{ meaning: '', example: '' }];
  const meaningsHtml = meanings
    .map(
      (m, i) => `
      <div class="edit-meaning-row">
        <span class="edit-meaning-index">${circledNumber(i + 1)}</span>
        <div class="edit-meaning-fields">
          <textarea class="edit-field edit-meaning-input" rows="1" data-action="edit-meaning" data-id="${escapeHtml(
            word.id
          )}" data-index="${i}" placeholder="뜻">${escapeHtml(m.meaning)}</textarea>
          <textarea class="edit-field edit-example-input" rows="1" data-action="edit-example" data-id="${escapeHtml(
            word.id
          )}" data-index="${i}" placeholder="예시 (선택)">${escapeHtml(m.example)}</textarea>
        </div>
      </div>`
    )
    .join('');

  return `
  <div class="word-card editable ${focused ? 'focused' : ''} ${selected ? 'edit-selected' : ''} ${
    p.memorized ? 'memorized' : ''
  }" data-id="${escapeHtml(word.id)}" data-index="${index}">
    <button class="card-edit-delete" data-action="edit-delete-word" data-id="${escapeHtml(
      word.id
    )}" aria-label="단어 삭제">×</button>
    <textarea class="edit-field edit-word-input" rows="1" data-action="edit-word" data-id="${escapeHtml(
      word.id
    )}" placeholder="표제어">${escapeHtml(word.word)}</textarea>
    <div class="edit-meanings">${meaningsHtml}</div>
    <button class="edit-add-meaning-btn" data-action="edit-add-meaning" data-id="${escapeHtml(
      word.id
    )}">+ 새 뜻 추가</button>
  </div>`;
}

function getExportMatches() {
  const s = ui.exportStatus;
  const cats = ui.exportCategories || new Set(getCategories());
  return words.filter((w) => {
    if (!cats.has(w.category)) return false;
    if (s.all) return true;
    if (!s.unmemorized && !s.important) return false;
    const p = progress[w.id];
    if (s.unmemorized && (!p || !p.memorized)) return true;
    if (s.important && p && p.important) return true;
    return false;
  });
}

function doExport() {
  const matches = getExportMatches();
  if (matches.length === 0) {
    alert('내보낼 단어가 없습니다.');
    return;
  }
  const csv = wordsToCSV(matches, progress);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const filename = `단어장_내보내기_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(
    now.getDate()
  )}_${pad(now.getHours())}${pad(now.getMinutes())}.csv`;
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  ui.exportOpen = false;
  render();
}
